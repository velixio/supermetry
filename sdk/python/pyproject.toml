[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermetry-apps"
version = "0.1.0"
description = "Crash and error reporting client for Supermetry App Health"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.hatch.build.targets.wheel]
packages = ["supermetry_apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
