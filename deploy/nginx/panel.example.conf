# Panel analytics — https://panel.example.com
# Install: sudo cp deploy/nginx/panel.example.com.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
# Panel must run with (in .env):
#   PANEL_LISTEN=127.0.0.1:8787
#   PANEL_BASE_URL=https://panel.example.com        # makes every cookie Secure and every snippet https
#   PANEL_TRUSTED_PROXIES=127.0.0.1/32,::1/128       # trust X-Forwarded-For only from this nginx

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/ssl/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ana_example_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Events are at most 8 KB; nothing in Panel needs large uploads.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (do not append): the visitor IP is identity input for
        # analytics, so a client must not be able to inject its own value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
