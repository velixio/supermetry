{{- include "supermetry.validate" . -}}
{{- if include "supermetry.createSecret" . }}
{{- $name := include "supermetry.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supermetry.labels" . | nindent 4 }}
  annotations:
    # The secret key decrypts stored TOTP and notification secrets, and the
    # bundled database was initialised with this password: keep both even
    # after `helm uninstall`, so a reinstall over the same volumes still works.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.secretKey.existingSecret }}
  {{- if .Values.secretKey.value }}
  secret-key: {{ .Values.secretKey.value | b64enc | quote }}
  {{- else if hasKey $existing "secret-key" }}
  secret-key: {{ index $existing "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
  {{- if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else if hasKey $existing "postgres-password" }}
  postgres-password: {{ index $existing "postgres-password" | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
