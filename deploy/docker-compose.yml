# docker compose up -d --build
#
# The app reads its settings from the .env file in the repository root (../.env).
#
# - SUPERMETRY_DATABASE_URL set in ../.env: that database is used as it is.
#   Inside the container, `localhost` is the container itself: use
#   host.docker.internal to reach a PostgreSQL running on this machine.
# - SUPERMETRY_DATABASE_URL not set: the bundled PostgreSQL container is the
#   database. Start it with the bundled-db profile (a global flag, so it goes
#   before `up`):
#     docker compose --profile bundled-db up -d --build
#   Its user, password and database are separate settings in ../.env:
#     POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB   (each defaults to "supermetry")

# Fixed project name, so containers, networks and volumes are called supermetry-*
# whatever this directory is named.
name: supermetry

services:
  supermetry:
    image: supermetry
    container_name: supermetry
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      # Start with: cp .env.example .env   (in the repository root)
      - ../.env
    environment:
      # Used only when SUPERMETRY_DATABASE_URL is not set: the app then connects to the
      # bundled container with POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB from ../.env.
      SUPERMETRY_DATABASE_HOST: postgres
      SUPERMETRY_DATA_DIR: /data
      SUPERMETRY_LISTEN: 0.0.0.0:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - supermetry-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    container_name: supermetry-postgres
    profiles: ["bundled-db"]
    image: postgres:18-alpine
    entrypoint: ["sh", "/postgres-entrypoint.sh"]
    env_file:
      # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB; each defaults to
      # "supermetry" in the entrypoint script.
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres-entrypoint.sh:/postgres-entrypoint.sh:ro
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  supermetry-data:
  postgres-data:
