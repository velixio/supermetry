services:
  supermetry:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      # Start with: cp ../.env.example .env
      - .env
    environment:
      SUPERMETRY_DATABASE_URL: postgres://supermetry:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/supermetry?sslmode=disable
      SUPERMETRY_DATA_DIR: /data
      SUPERMETRY_LISTEN: 0.0.0.0:8787
    ports:
      - "8787:8787"
    volumes:
      - supermetry-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: supermetry
      POSTGRES_USER: supermetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermetry -d supermetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  supermetry-data:
  postgres-data:
