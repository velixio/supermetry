# docker compose up -d --build
#
# The app reads its settings, including SUPERMETRY_DATABASE_URL, from the .env file in
# the repository root (../.env). Inside the container,
# `localhost` is the container itself: use host.docker.internal to reach a
# PostgreSQL running on this machine.
#
# To run PostgreSQL in a container too, set in ../.env:
#   POSTGRES_PASSWORD=<password>
#   SUPERMETRY_DATABASE_URL=postgres://supermetry:<password>@postgres:5432/supermetry?sslmode=disable
# and start with the bundled-db profile:
#   docker compose --profile bundled-db up -d --build

services:
  supermetry:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      # Start with: cp .env.example .env   (in the repository root)
      - ../.env
    environment:
      SUPERMETRY_DATA_DIR: /data
      SUPERMETRY_LISTEN: 0.0.0.0:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - supermetry-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    profiles: ["bundled-db"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: supermetry
      POSTGRES_USER: supermetry
    env_file:
      # POSTGRES_PASSWORD comes from ../.env. PostgreSQL refuses to start without it.
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermetry -d supermetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  supermetry-data:
  postgres-data:
