# Non-secret rig configuration. Sourced by every tools/bench/rig script (and by phase-B
# loaders that need to find the incumbents). Secrets live in tools/bench/rig/.env (600).
# Machine-local overrides (e.g. a port that's taken) go in rig.local.conf.

# --- pinned versions -------------------------------------------------------
PLAUSIBLE_CE_REF=v3.2.1                      # plausible/community-edition branch (newest v3.x on 2026-10-07)
PLAUSIBLE_IMAGE=ghcr.io/plausible/community-edition:v3.2.1
UMAMI_IMAGE=ghcr.io/umami-software/umami:3.4.0   # v3 images are PG-only; the "postgresql-" tag prefix ended at 3.0.0
GOATCOUNTER_VERSION=v2.7.0                   # latest release on 2026-10-07
GOATCOUNTER_URL="https://github.com/arp242/goatcounter/releases/download/${GOATCOUNTER_VERSION}/goatcounter-${GOATCOUNTER_VERSION}-linux-amd64.gz"

# --- ports (contract: tools/bench/CONTRACT.md) ------------------------------------
PLAUSIBLE_PORT=${PLAUSIBLE_PORT:-8000}
UMAMI_PORT=${UMAMI_PORT:-3000}
GOATCOUNTER_PORT=${GOATCOUNTER_PORT:-8081}

# --- local PG (shared, stock config; never restarted by these scripts) -------
PGHOST_LOCAL=localhost
PGPORT_LOCAL=5432

# --- seed -------------------------------------------------------------------
SITE_COUNT=${SITE_COUNT:-100}                # site1.test … site100.test
