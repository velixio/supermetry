# tools/bench/rig PG tuning profile for the local PG 18 (scorecard: "stock + one documented profile",
# the same for Umami, GoatCounter and Supermetry). Rig: 12 vCPU, 17.2 GiB RAM, virtio disk that
# reports rotational. NOT applied yet; install with ./apply-pg-tuning.sh --apply (needs a restart).

# ~25% of RAM (scorecard rule). Leaves the rest for the OS page cache, which PG relies on as a second cache.
shared_buffers = 4GB

# Planner hint only (no allocation): shared_buffers plus the page cache PG can expect. ~60% of RAM,
# because the box also runs ~7 GB of unrelated processes.
effective_cache_size = 10GB

# Per sort/hash node per worker. Analytics GROUP BYs (20K paths, distinct visitors) fit in memory
# without spilling. Hashes get 2x via hash_mem_multiplier, and ~100 connections at a few nodes each stays bounded.
work_mem = 32MB

# Index builds and VACUUM after the 90M-140M-row bulk loads; 1 GB makes CREATE INDEX far faster than the 64 MB default.
maintenance_work_mem = 1GB

# Bulk loads write a lot of WAL. A 1 GB cap forces a checkpoint every few seconds, with full-page-write
# amplification. 8 GB is a soft cap that the 107 GB disk can afford.
max_wal_size = 8GB
# Keep recycled WAL segments around between load batches, instead of re-creating them.
min_wal_size = 1GB

# With max_wal_size raised, time-based checkpoints dominate. 15 min halves the checkpoint I/O versus 5 min;
# the cost, longer crash recovery, doesn't matter on a bench box.
checkpoint_timeout = 15min

# Parallelism sized to 12 vCPUs. The worker pool has room for parallel workers plus PG's own
# background workers (restart required).
max_worker_processes = 16
# Never more parallel workers than vCPUs in total.
max_parallel_workers = 12
# One dashboard fires several panel queries at once. 4 workers per query (5 processes with the leader)
# speeds up long scans without one query taking the whole box.
max_parallel_workers_per_gather = 4
# Parallel CREATE INDEX after bulk loads.
max_parallel_maintenance_workers = 4

# NOT set: random_page_cost = 1.1. Enable it only if a random-read test shows the "rotational"
# virtual disk is SSD/NVMe-backed. Record the disk type first (scorecard, test rig).

# PG 18 async I/O (io_method=worker default): 3 workers were the S3 bottleneck (58-83% CPU each, proto-opt 2026-10-07); 8 of 12 vCPUs.
io_workers = 8

# Many concurrent test schemas with partitioned tables exhaust the default lock table (64): parallel test runs failed with SQLSTATE 53200 (2026-10-07).
max_locks_per_transaction = 512
