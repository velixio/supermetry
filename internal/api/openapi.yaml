      parameters:
        - $ref: '#/components/parameters/OrgPathID'
      responses:
        '200':
          description: Sites scheduled for deletion.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletedSite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/overview:
    get:
      operationId: getSitesOverview
      security: [{ cookieAuth: [] }]
      summary: List every site readable by the signed-in user with aggregate traffic
      parameters:
        - name: period
          in: query
          description: Aggregate window; accepted values are 24h, 7d, and 30d.
          schema: { type: string, default: 24h }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: One page of readable sites. Traffic is derived from bounded aggregate tables.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesOverviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    delete:
      operationId: deletePrivateSite
      security: [{ cookieAuth: [] }]
      summary: Schedule or immediately delete a site
      responses:
        '200':
          description: Deletion accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/restore:
    post:
      operationId: restoreSite
      security: [{ cookieAuth: [] }]
      summary: Restore a site during its deletion grace period
      parameters:
        - $ref: '#/components/parameters/SitePathID'
      responses:
        '204': { description: Site restored. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The site cannot be restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleError' }
  /api/private/sites/{site}/demo/heartbeat:
    post:
      operationId: heartbeatDemoProject
      security: [{ cookieAuth: [] }]
      summary: Keep watched demo traffic active
      parameters:
        - name: site
          in: path
          required: true
          schema: { type: integer, format: int32 }
      responses:
        '204': { description: The demo heartbeat was recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/me/email:
    post:
      operationId: startCurrentUserEmailChange
      security: [{ cookieAuth: [] }]
      summary: Send an email-change confirmation
      description: Requires SMTP. The one-time confirmation token expires after one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '202': { description: Accepted. A confirmation is sent to the new address unless it is already registered; the response is the same either way. }
        '409': { description: SMTP is not configured. }
        '429': { description: Too many password checks. }
  /api/private/auth/email-change/confirm:
    get:
      operationId: confirmCurrentUserEmailChangeLink
      security: [{ cookieAuth: [] }]
      summary: Confirm an email change from a link
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '303': { description: "Redirects to the login page without the requesting user's session, else to the profile page with email_changed=1 (changed, old address notified) or email_changed=0 (token invalid, expired, used, or for another user)." }
    post:
      operationId: confirmCurrentUserEmailChange
      security: [{ cookieAuth: [] }]
      summary: Confirm an email change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '204': { description: Email changed and old address notified. }
        '400': { description: Token is invalid, expired, already used, or belongs to another user. }
        '401': { description: The requesting user's session is required. }
  /api/private/me/password:
    post:
      operationId: changeCurrentUserPassword
      security: [{ cookieAuth: [] }]
      summary: Change the signed-in user's password
      description: Revokes every other session and keeps the current session active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed and other sessions revoked. }
        '429': { description: Too many password checks. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/private/sites/{site_id}/shares:
