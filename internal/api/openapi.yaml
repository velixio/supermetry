          description: Result per channel.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/GitHubStarsAlertDelivery' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/summary:
    get:
      operationId: orgGetGitHubStarsSummary
      security: [{ cookieAuth: [] }]
      summary: Live star counters and the net change over 24 hours and 7 days
      description: Reads the repository selected by repo_id. Returns 404 for an unknown repository.
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }, { $ref: '#/components/parameters/GitHubStarsRepoID' }]
      responses:
        '200': { description: Star summary., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/series:
    get:
      operationId: orgGetGitHubStarsSeries
      security: [{ cookieAuth: [] }]
      summary: Gained, lost, net and cumulative stars per bucket
      description: Buckets are local hours, days or calendar months in the configured time zone. Defaults are the last 24 hours (hour), 30 days (day) or 12 months (month, starting no earlier than the first event or snapshot). Hour ranges are limited to 31 days, day ranges to 5 years and month ranges to 20 years.
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { $ref: '#/components/parameters/GitHubStarsRepoID' }
        - { name: granularity, in: query, required: true, schema: { type: string, description: hour, day or month. } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Star series., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsSeries' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/events:
    get:
      operationId: orgListGitHubStarsEvents
      security: [{ cookieAuth: [] }]
      summary: List the user-attributed star and unstar log, newest first
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { $ref: '#/components/parameters/GitHubStarsRepoID' }
        - { name: cursor, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/GitHubStarsEventLimit' }
      responses:
        '200': { description: Star events., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsEvents' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/annotations:
    get:
      operationId: orgListGitHubStarsAnnotations
      security: [{ cookieAuth: [] }]
      summary: List chart annotations
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }, { $ref: '#/components/parameters/GitHubStarsRepoID' }]
      responses:
        '200': { description: Annotations., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsAnnotations' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: orgCreateGitHubStarsAnnotation
      security: [{ cookieAuth: [] }]
      summary: Add a chart annotation such as a launch marker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubStarsAnnotationInput' }
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }, { $ref: '#/components/parameters/GitHubStarsRepoID' }]
      responses:
        '201': { description: Annotation created., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsAnnotation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/annotations/{annotation}:
    delete:
      operationId: orgDeleteGitHubStarsAnnotation
      security: [{ cookieAuth: [] }]
      summary: Delete a chart annotation
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { $ref: '#/components/parameters/GitHubStarsRepoID' }
        - { name: annotation, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '204': { description: Annotation deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/users/{login}:
    delete:
      operationId: orgEraseGitHubStarsUser
      security: [{ cookieAuth: [] }]
      summary: Erase every recorded star event of a GitHub user
      description: Privacy erasure. Aggregates are recomputed from the remaining events; the live counters and daily snapshots keep their totals. Audited as github_stars.user_erased with the event count only.
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { $ref: '#/components/parameters/GitHubStarsRepoID' }
        - { name: login, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 39 } }
      responses:
        '200': { description: Events erased., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsErasure' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/update:
    get:
      operationId: adminGetUpdateStatus
      security: [{ cookieAuth: [] }]
      summary: Check whether a newer stable Supermetry release is available
      description: Performs a bounded, cached, read-only check of the official GitHub latest stable release. It never downloads or applies an update.
      responses:
        '200': { description: Update availability., content: { application/json: { schema: { $ref: '#/components/schemas/AdminUpdateStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/update/check:
    post:
      operationId: adminCheckUpdate
      security: [{ cookieAuth: [] }]
      summary: Check for a newer stable release now
      description: Asks the official GitHub latest stable release again instead of using the six-hour cache. Results younger than 15 seconds are reused so repeated clicks cannot exhaust GitHub's rate limit. It never downloads or applies an update.
      responses:
        '200': { description: Fresh update availability., content: { application/json: { schema: { $ref: '#/components/schemas/AdminUpdateStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/update/apply:
    post:
      operationId: adminApplyUpdate
      security: [{ cookieAuth: [] }]
      summary: Apply a verified stable release
      description: Re-authenticates an instance administrator, creates an idempotent update job, and dispatches it to the narrow privileged updater helper. The helper takes and verifies a full database backup before activation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminApplyUpdateRequest' }
      responses:
        '202': { description: Update accepted., content: { application/json: { schema: { $ref: '#/components/schemas/AdminUpdateJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: An update is already active or this deployment is not managed by the updater., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/private/setup/status:
    get:
      operationId: getSetupStatus
      security: []
      summary: Check whether first-run setup is available
      description: Returns only whether the one-time setup flow is still available. Authentication does not change the response.
      responses:
        '200':
          description: Setup availability.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available]
                properties:
                  available: { type: boolean }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/private/me:
    get:
      operationId: getCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Get the signed-in user and memberships
      responses:
        '200':
          description: Current account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Update account preferences or the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200': { description: Updated identity. }
        '403': { description: A valid CSRF cookie and header are required. }
    delete:
      operationId: deleteCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Delete the signed-in account
      description: Anonymises the user row so audit actor IDs and invitations remain, and removes memberships and sessions. Refused while the user is an organization's last owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Account anonymised and authentication cookies cleared. }
        '409': { description: Transfer ownership or delete the organization first. }
        '429': { description: Too many password checks. }
  /api/private/me/demo-prompt/dismiss:
    post:
      operationId: dismissDemoPrompt
      security: [{ cookieAuth: [] }]
      summary: Permanently dismiss the demo-project onboarding prompt
      responses:
        '204': { description: The prompt is dismissed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/me/orgs/deleted:
    get:
      operationId: listDeletedOrganizations
      security: [{ cookieAuth: [] }]
      summary: List owner-deleted, restorable organizations owned by the signed-in user
      responses:
        '200':
          description: Organizations scheduled for deletion.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletedOrganization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/private/me/orgs/{org}/restore:
    post:
      operationId: restoreOrganization
      security: [{ cookieAuth: [] }]
      summary: Restore an owner-deleted organization during its deletion grace period
      parameters:
        - $ref: '#/components/parameters/OrgPathID'
      responses:
        '204': { description: Organization restored. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The organization is outside its grace period or has been erased.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleError' }
  /api/private/orgs/{org}/demo:
    post:
      operationId: createDemoProject
      security: [{ cookieAuth: [] }]
      summary: Create and start seeding the organization's demo project
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoRequest'
      responses:
        '202':
          description: The demo project was created and its background seed was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: The timezone is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The organization already has a demo project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
  /api/private/orgs/{org}:
    parameters:
      - $ref: '#/components/parameters/OrgPathID'
    patch:
      operationId: renameOrganization
      security: [{ cookieAuth: [] }]
      summary: Rename an organization without changing its slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Renamed organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400':
          description: The organization name is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteOrganization
      security: [{ cookieAuth: [] }]
      summary: Schedule or immediately delete an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Deletion accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/orgs/{org}/sites/deleted:
    get:
      operationId: listDeletedSites
      security: [{ cookieAuth: [] }]
