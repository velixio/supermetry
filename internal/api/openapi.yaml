    CohortCondition:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        One test on a profile. `event`: performed the custom event `name` at least `min_count` times in the window. `page`: viewed `path`
        (`operator` is or starts_with) at least `min_count` times. `event_property`: performed event `name` with property `key` equal to `value`
        at least `min_count` times. `activity`: has at least `min_count` `metric` (sessions or events) in the window. `first_seen` and `last_seen`:
        the profile's first or last activity is `within` or `before` the last `days` days. `negate` inverts the test.
      properties:
        type: { type: string, x-go-type: string, enum: [event, page, event_property, activity, first_seen, last_seen] }
        negate: { type: boolean }
        name: { type: string, maxLength: 200 }
        path: { type: string, maxLength: 500 }
        operator: { type: string, x-go-type: string, enum: [is, starts_with] }
        key: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 200 }
        metric: { type: string, x-go-type: string, enum: [sessions, events] }
        min_count: { type: integer, minimum: 1, maximum: 1000 }
        relation: { type: string, x-go-type: string, enum: [within, before] }
        days: { type: integer, minimum: 1, maximum: 365 }
    CohortDefinition:
      type: object
      additionalProperties: false
      required: [match, window_days, conditions]
      properties:
        match: { type: string, x-go-type: string, enum: [all, any] }
        window_days: { type: integer, minimum: 1, maximum: 90, description: 'Rolling window, in 24-hour days ending at evaluation time, applied to event, page, property and activity conditions.' }
        conditions:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/CohortCondition' }
    CohortInput:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        definition: { $ref: '#/components/schemas/CohortDefinition' }
    Cohort:
      type: object
      required: [id, site_id, name, definition, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        site_id: { type: integer, format: int32 }
        name: { type: string }
        definition: { $ref: '#/components/schemas/CohortDefinition' }
        created_by: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CohortList:
