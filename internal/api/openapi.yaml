openapi: 3.1.0
info:
  title: Panel Analytics API
  version: 1.0.0
  description: The versioned API for querying Panel analytics and operational health.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/private/me:
    get:
      operationId: getCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Get the signed-in user and memberships
      responses:
        '200': { description: Current account details. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Update the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 1 } }
      responses:
        '200': { description: Updated identity. }
        '403': { description: A valid CSRF cookie and header are required. }
    delete:
      operationId: deleteCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Delete the signed-in account
      description: Anonymises the user row so audit actor IDs and invitations remain, and removes memberships and sessions. Refused while the user is an organization's last owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Account anonymised and authentication cookies cleared. }
        '409': { description: Transfer ownership or delete the organization first. }
        '429': { description: Too many password checks. }
  /api/private/me/email:
    post:
      operationId: startCurrentUserEmailChange
      security: [{ cookieAuth: [] }]
      summary: Send an email-change confirmation
      description: Requires SMTP. The one-time confirmation token expires after one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '202': { description: Accepted. A confirmation is sent to the new address unless it is already registered; the response is the same either way. }
        '409': { description: SMTP is not configured. }
        '429': { description: Too many password checks. }
  /api/private/auth/email-change/confirm:
    get:
      operationId: confirmCurrentUserEmailChangeLink
      security: [{ cookieAuth: [] }]
      summary: Confirm an email change from a link
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '303': { description: "Redirects to the login page without the requesting user's session, else to the profile page with email_changed=1 (changed, old address notified) or email_changed=0 (token invalid, expired, used, or for another user)." }
    post:
      operationId: confirmCurrentUserEmailChange
      security: [{ cookieAuth: [] }]
      summary: Confirm an email change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '204': { description: Email changed and old address notified. }
        '400': { description: Token is invalid, expired, already used, or belongs to another user. }
        '401': { description: The requesting user's session is required. }
  /api/private/me/password:
    post:
      operationId: changeCurrentUserPassword
      security: [{ cookieAuth: [] }]
      summary: Change the signed-in user's password
      description: Revokes every other session and keeps the current session active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed and other sessions revoked. }
        '429': { description: Too many password checks. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/private/sites/{site_id}/replays:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listReplays
      security: [{ cookieAuth: [] }]
      summary: List session replays
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Replay page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replays/{session_id}/data:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: session_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getReplayData
      security: [{ cookieAuth: [] }]
      summary: Download replay events
      responses:
        '200':
          description: A gzip-compressed NDJSON event stream
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replays/css/{hash}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: hash, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
    get:
      operationId: getReplayCSS
      security: [{ cookieAuth: [] }]
      summary: Download a replay stylesheet
      responses:
        '200':
          description: A gzip-compressed stylesheet
          content:
            text/css:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replay-settings:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: getReplaySettings
      security: [{ cookieAuth: [] }]
      summary: Get site replay settings
      responses:
        '200': { description: Resolved settings and environment locks, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaySiteSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateReplaySettings
      security: [{ cookieAuth: [] }]
      summary: Replace site replay settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaySiteSettingsInput' }
      responses:
        '200': { description: Resolved settings, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaySiteSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A submitted field is locked by an environment variable. }
  /api/private/instance/replay-storage:
    get:
      operationId: getReplayStorage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Get instance replay storage settings
      responses:
        '200': { description: Resolved storage settings without the S3 secret, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayStorageSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateReplayStorage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Replace instance replay storage settings
      description: migrate records a background migration request; migration execution is asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayStorageInput' }
      responses:
        '200': { description: Resolved storage settings, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayStorageSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A submitted field is locked by an environment variable. }
  /api/public/v1/events:
    post:
      operationId: submitEvent
      security: []
      summary: Submit an analytics event
      description: |
        Public event intake; no API key is required. Requests are counted against
        per-site and per-visitor-address rate limits. Deployments may configure a
        different path with `PANEL_EVENT_PATH`.

        When calling this endpoint through a reverse proxy, forward the visitor's
        address with `X-Forwarded-For` only when that proxy is listed in
        `PANEL_TRUSTED_PROXIES`. Forward the visitor's `User-Agent` as well so
        device dimensions and bot filtering remain accurate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
          text/plain:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '202':
          description: The event was accepted for processing.
        '400':
          description: The payload, site, page URL, or client address is invalid.
        '429':
          description: The site or visitor-address rate limit was exceeded.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '503':
          description: Event intake is unavailable or its bounded queue is full.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |-
            curl --request POST https://analytics.example.com/api/public/v1/events \
              --header 'Content-Type: application/json' \
              --header 'User-Agent: Mozilla/5.0' \
              --header 'X-Forwarded-For: 203.0.113.10' \
              --data '{"site":"my-site","name":"pageview","url":"https://www.example.com/pricing"}'
        - lang: JavaScript
          label: fetch
          source: |-
            await fetch('https://analytics.example.com/api/public/v1/events', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'User-Agent': visitorUserAgent,
                // Only send this through a proxy listed in PANEL_TRUSTED_PROXIES.
                'X-Forwarded-For': visitorAddress,
              },
              body: JSON.stringify({
                site: 'my-site',
                name: 'pageview',
                url: 'https://www.example.com/pricing',
              }),
            });
  /api/public/v1/heatmaps/query:
    post:
      operationId: heatmapQuery
      summary: Query an aggregated click heatmap and scroll map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapRequest'
      responses:
        '200':
          description: Aggregated heatmap results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/vitals/query:
    post:
      operationId: vitalsQuery
      summary: Query Web Vitals from raw events
      description: Returns p75 and rating shares for LCP, CLS, and INP. The requested range must be inside the site's raw-data retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalsRequest'
      responses:
        '200':
          description: Web Vitals results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/query:
    post:
      operationId: query
      summary: Run an analytics query
      description: "Set Accept: text/csv or format=csv for CSV. With CSV, limit=all streams cursor pages up to 100,000 rows."
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/ExportLimit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/stats/summary:
    get:
      operationId: statsSummary
      summary: Get summary metrics
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/stats/timeseries:
    get:
      operationId: statsTimeseries
      summary: Get a metrics time series
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
        - name: interval
          in: query
          schema:
            type: string
            pattern: '^(hour|day|week|month)$'
            default: day
            example: day
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/stats/breakdown:
    get:
      operationId: statsBreakdown
      summary: Get a dimension breakdown
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
        - name: dimension
          in: query
          required: true
          description: Analytics dimension to group by, including browser_version, os_version, screen_size, language, and hostname. screen_size returns mobile, tablet, laptop, desktop, or large; stored value 0 returns an empty string for Unknown. Channel is derived from source and medium and returns Direct, Organic Search, Paid Search, Organic Social, Paid Social, Email, Referral, AI Assistants, or Other.
          schema:
            type: string
            example: page
        - $ref: '#/components/parameters/StatsLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/funnels/query:
    post:
      operationId: funnelQuery
      summary: Run a funnel query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelRequest'
      responses:
        '200':
          description: Funnel results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/journeys/query:
    post:
      operationId: journeyQuery
      summary: Run a page journey query
      description: The date range must fit within the site's raw-event retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
      responses:
        '200':
          description: Sankey-ready journey nodes and links
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/retention/query:
    post:
      operationId: retentionQuery
      summary: Run a retention query
      description: >-
        Visitor identity is linkable only within one local day. Offset n counts
        daily identities with at least n+1 sessions on that local day; week and
        month intervals group daily cohorts and do not link people across days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionRequest'
      responses:
        '200':
          description: Within-day session-return cohorts
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/realtime:
    get:
      operationId: realtime
      summary: Get active visitors, pages, and sources from the last 30 minutes
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Realtime analytics
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/sites:
    get:
      operationId: listSites
      summary: List accessible sites
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sites page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createSite
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: getSite
      summary: Get a site
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSite
      summary: Update a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSite
      summary: Delete a site
      responses:
        '204':
          description: Site deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/goals:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listGoals
      summary: List goals
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: array
