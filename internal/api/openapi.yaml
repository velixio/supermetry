  /api/public/v1/stats/breakdown:
    get:
      operationId: statsBreakdown
      summary: Get a dimension breakdown
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
        - name: dimension
          in: query
          required: true
          description: >-
            Analytics dimensions to group by. Supply dimensions as repeated parameters, comma-separated values, or a
            mixture of both; order is preserved. For example, dimension=weekday&dimension=hour_of_day and
            dimension=weekday,hour_of_day are equivalent for the Traffic grid.
            Traffic buckets use the site's time zone unless timezone is explicitly supplied; weekday is 0 for Sunday
            through 6 for Saturday, and hour_of_day is 0 through 23. Traffic grid requests read retained raw data and
            must fit inside the site's named raw-retention window. The Traffic grid supports distinct visitors and
            summed pageviews, and missing cells are omitted. screen_size returns mobile, tablet, laptop, desktop, or
            large; stored value 0 returns an empty string for Unknown. Channel is derived from source and medium and
            returns Direct, Organic Search, Paid Search, Organic Social, Paid Social, Email, Referral, AI Assistants,
            or Other.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 3
            items:
              $ref: '#/components/schemas/StatsBreakdownDimension'
            example: [weekday, hour_of_day]
        - $ref: '#/components/parameters/StatsLimit'
        - $ref: '#/components/parameters/Cursor'
