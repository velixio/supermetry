  /l/{slug}:
    get:
      operationId: followShortLink
      security: []
      summary: Redirect a managed short link
      description: >-
        Public endpoint. Answers 302 with the destination stored on the link, with the link's default UTM
        parameters appended when the destination does not already set them. The destination is never taken
        from the request, so the endpoint cannot be used as an open redirect. Bots and requests that send
        a Do Not Track or Global Privacy Control signal on a site that respects them are redirected but not
        counted. Disabled and unknown links answer 404; expired links and links past their click limit
        answer 410.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
      responses:
        '302':
          description: Redirect to the destination.
          headers:
            Location: { schema: { type: string, format: uri } }
        '404': { description: The link does not exist or is disabled. }
        '410': { description: The link has expired or reached its click limit. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /px/{file}:
    get:
      operationId: trackingPixel
      security: []
      summary: Record a tracking pixel impression or serve a pixel-project badge
      description: >-
        Public endpoint. The file is the site's public ID followed by .gif. It always answers with the same
        1x1 transparent GIF, whether or not the site exists or the hit was counted. The optional c query
        parameter tags the impression with a campaign name of up to 64 letters, numbers, dot, underscore,
        colon or hyphen; an invalid tag is ignored. No cookie is set and no IP address is stored.
        A .svg file with a site's public ID serves a badge with that site's running impression total across all
        campaigns, or with style=stats the total, today and a 30-day graph; loading it counts one impression.
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, maxLength: 70 }
        - name: c
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: style
          in: query
          schema: { type: string, enum: [flat, flat-square, stats], description: "stats draws the wider badge with the total, today and a 30-day sparkline (pixel projects only)." }
        - name: color
          in: query
          schema: { type: string, pattern: '^[0-9A-Fa-f]{6}$' }
      responses:
        '200':
          description: A 1x1 transparent GIF.
          content:
            image/gif:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
  /c/{rest}:
    get:
      operationId: openCounter
      security: []
      summary: Show or render an opt-in public GitHub view counter
      description: >-
        Public endpoint, disabled by default. A github.com owner or repository key returns a stats page;
        adding .svg or .gif returns an embeddable counter image. Only recognized image-proxy fetches are
        counted. IP addresses and user-agent strings are never stored.
      parameters:
        - name: rest
          in: path
          required: true
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: A counter page or image.
          content:
            text/html: { schema: { type: string } }
            image/gif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        '404': { description: Open counters are disabled, blocked, or the key is invalid. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Check process health
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Check service readiness
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /metrics:
    get:
      operationId: metrics
      security: []
      summary: Get Prometheus metrics
      description: >-
        When SUPERMETRY_METRICS_TOKEN is set, requires Authorization: Bearer <token> and
        returns 401 for missing or invalid credentials. When the token is unset,
        only loopback clients (resolved through SUPERMETRY_TRUSTED_PROXIES) can access
        metrics; other clients receive 404. Health and readiness endpoints remain public.
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys for the caller's organization
      description: Requires keys:manage. Secret values and hashes are never returned.
      responses:
        '200':
          description: API keys in the caller's organization
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createApiKey
      summary: Create a narrower API key
      description: Requires keys:manage. Scopes, site access, and expiry cannot exceed the caller key; keys:manage itself cannot be delegated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created; the secret is returned only in this response.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Requires keys:manage. A key may revoke itself. IDs outside the caller's organization return 404.
      responses:
        '204':
          description: API key revoked
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/private/sites/{site}/revenue/report:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: getRevenueReport
      summary: Revenue breakdown with attribution
      description: |
        Orders, revenue, average order value, revenue per visitor and, in identified mode with profiles enabled, unique customers and repeat-purchase rate,
        grouped by one breakdown. `first_click` and `last_click` credit the first or most recent source or campaign visit by the same person inside
        `lookback_days` before the order; visits link across days only through customer profiles, because visitor ids are re-salted daily. Visits without
        a source or campaign never take credit, and an order with no qualifying visit is reported under the empty key (direct). Orders in more than one
        currency are refused. Computed from retained raw events and sessions, capped at 20,000 orders (`truncated`). Send `Accept: text/csv` to export,
        which needs the `data:export` scope.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: breakdown, in: query, required: true, schema: { type: string, enum: [country, region, source, campaign, page, product] } }
        - { name: attribution, in: query, schema: { type: string, enum: [event, first_click, last_click], default: event } }
        - { name: lookback_days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: Revenue report.
          content:
            application/json: { schema: { $ref: '#/components/schemas/RevenueReport' } }
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Orders use more than one currency., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/private/sites/{site}/revenue/customers:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: listRevenueCustomers
      summary: Identified customers by revenue
      description: Available only in identified mode with profiles enabled and gated by the `profiles:read` scope, because external ids can be personal data.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Customers by revenue, largest first.
          content:
            application/json: { schema: { $ref: '#/components/schemas/RevenueCustomersResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site}/cohorts:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: listCohorts
      summary: List saved cohorts
      description: Cohorts are saved audience definitions; membership is evaluated on demand and never stored.
      responses:
        '200':
          description: Saved cohorts by name.
          content:
            application/json: { schema: { $ref: '#/components/schemas/CohortList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createCohort
      summary: Save a cohort
      description: Requires an owner, admin or editor role. The change is recorded in the organization audit log.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CohortInput' } }
      responses:
        '201':
          description: Created cohort.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Cohort' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A cohort with this name already exists., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/private/sites/{site}/cohorts/evaluate:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    post:
      operationId: evaluateCohort
      summary: Evaluate a cohort definition
      description: |
        Counts the profiles matching a saved cohort (`cohort_id`) or an unsaved `definition`, against retained data only, over a rolling window of
        `window_days` ending now. The count stops at 100,000 (`size_capped`) and the query is cancelled at the statement timeout (503).
        A sample of members (`sample_limit` up to 50) is returned only to callers holding `profiles:read`; otherwise `sample_withheld` is true.
        Requires identified tracking with profiles enabled; anonymous mode answers 403 with the policy explanation.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CohortEvaluateRequest' } }
      responses:
        '200':
          description: Cohort size and optional sample.
          content:
            application/json: { schema: { $ref: '#/components/schemas/CohortEvaluation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/private/cohorts/{cohort}:
    parameters:
      - { name: cohort, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      operationId: updateCohort
      summary: Rename or redefine a cohort
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CohortInput' } }
      responses:
        '200':
          description: Updated cohort.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Cohort' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A cohort with this name already exists., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteCohort
      summary: Delete a cohort
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/cohorts/{cohort}/duplicate:
    parameters:
      - { name: cohort, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      operationId: duplicateCohort
      summary: Duplicate a cohort
      description: Creates a copy named "<name> (copy)", numbered when that name is taken.
      responses:
        '201':
          description: The copy.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Cohort' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site}/dashboards:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: listDashboards
      summary: List saved dashboards
      description: |
        Saved dashboards of the site by name. When the site has none, `data` holds one built-in dashboard
        (`builtin: true`, `id: 0`, `is_default: true`) that reproduces the standard dashboard in the layout model.
        Any member of the site may read.
      responses:
        '200':
          description: Dashboards.
          content:
            application/json: { schema: { $ref: '#/components/schemas/DashboardList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createDashboard
      summary: Save a dashboard
      description: Owner, admin or editor. Audited. Up to 50 per site; names are unique per site, ignoring case.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DashboardInput' } }
      responses:
        '201':
          description: Created dashboard (version 1, not the default).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Dashboard' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The name is taken or the site reached its limit., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/private/sites/{site}/dashboards/default:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: getDefaultDashboard
      summary: Get the dashboard to open for the site
      description: The saved dashboard flagged as default, otherwise the built-in dashboard.
      responses:
        '200':
          description: The effective default dashboard.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Dashboard' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: clearDefaultDashboard
      summary: Return the site to the built-in default dashboard
      description: Owner, admin or editor. Audited. Idempotent.
      responses:
        '204': { description: No saved dashboard is the default any more. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site}/dashboards/{dashboard}:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: dashboard, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getDashboard
      summary: Get one dashboard
      responses:
        '200':
          description: The dashboard.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Dashboard' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDashboard
      summary: Rename or re-lay out a dashboard
      description: |
        Owner, admin or editor. `version` must equal the stored version (optimistic concurrency); a mismatch is 409 and the
        client reloads and merges. A successful update increments `version`.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DashboardUpdate' } }
      responses:
        '200':
          description: Updated dashboard.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Dashboard' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stale version or the name is taken., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteDashboard
      summary: Delete a dashboard
      description: Owner, admin or editor. Audited. A dashboard of another site answers 404. Deleting the default returns the site to the built-in default.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site}/dashboards/{dashboard}/duplicate:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: dashboard, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      operationId: duplicateDashboard
      summary: Duplicate a dashboard
      description: Creates a copy named "<name> (copy)", numbered when that name is taken. The copy is never the default.
      responses:
        '201':
          description: The copy.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Dashboard' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The site reached its limit., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/private/sites/{site}/dashboards/{dashboard}/default:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: dashboard, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      operationId: setDefaultDashboard
      summary: Make a dashboard the site default
      description: Owner, admin or editor. Audited. Replaces the previous default atomically; does not change `version`.
      responses:
        '200':
          description: The dashboard, now the default.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Dashboard' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site}/power-users:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: listPowerUsers
      summary: Top profiles by sessions or events
      description: |
        Profiles whose sessions or events (pageviews and custom events) inside the inclusive date range, in the site time zone, reach `min`,
        busiest first. `qualifying` counts every profile at or above the threshold (stopping at 100,000). Needs `profiles:read` because external ids can be
        personal data, and identified tracking with profiles enabled.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: metric, in: query, description: sessions or events., schema: { type: string, default: sessions } }
        - { name: min, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 2 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Power users.
          content:
            application/json: { schema: { $ref: '#/components/schemas/PowerUsers' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/private/sites/{site}/notification-history:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: listNotificationHistory
      summary: List alert delivery history for a site
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DeliveryStatus' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/NotificationChannelKind' } }
        - { name: alert_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Delivery history newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationDelivery' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/sites/{site}/notification-history/{delivery}/retry:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: delivery, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      operationId: retryNotificationDelivery
      summary: Retry one failed alert delivery
      responses:
        '200':
          description: Updated delivery
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDelivery' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/orgs/{org}/notification-templates:
    parameters:
      - { $ref: '#/components/parameters/OrgPathID' }
    get:
      operationId: listNotificationTemplates
      summary: List notification templates and history settings
      responses:
        '200':
          description: Templates, documented variables, and settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/orgs/{org}/notification-templates/{kind}:
    parameters:
      - { $ref: '#/components/parameters/OrgPathID' }
      - { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/NotificationChannelKind' } }
    put:
      operationId: saveNotificationTemplate
      summary: Save a channel message template
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplateInput' } } }
      responses:
        '200': { description: Saved template, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: resetNotificationTemplate
      summary: Reset a channel message template to its default
      responses:
        '200': { description: Default template, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/orgs/{org}/notification-templates/{kind}/preview:
    parameters:
      - { $ref: '#/components/parameters/OrgPathID' }
      - { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/NotificationChannelKind' } }
    post:
      operationId: previewNotificationTemplate
      summary: Validate and preview a template with sample alert data
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplateInput' } } }
      responses:
        '200': { description: Rendered preview, content: { application/json: { schema: { $ref: '#/components/schemas/RenderedNotification' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/orgs/{org}/notification-settings:
    parameters:
      - { $ref: '#/components/parameters/OrgPathID' }
    put:
      operationId: saveNotificationSettings
      summary: Set notification history retention
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } }
      responses:
        '200': { description: Saved settings, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/sites/{site}/integrations:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: listSiteIntegrations
      security: [{ cookieAuth: [] }]
      summary: List the integration catalog of a site with each connection state
      responses:
        '200':
          description: Configured providers; unconfigured providers are hidden
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/IntegrationCatalogEntry' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site}/integrations/{provider}/connect:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: provider, in: path, required: true, schema: { type: string, maxLength: 32 } }
    post:
      operationId: connectSiteIntegration
      security: [{ cookieAuth: [] }]
      summary: Start the OAuth connection and return the provider authorization URL
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationConnectRequest' } } } }
      responses:
        '200':
          description: Authorization URL to open in the browser
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationAuthorization' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The provider is not configured on this instance. }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/sites/{site}/integrations/{provider}/backfill:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: provider, in: path, required: true, schema: { type: string, maxLength: 32 } }
    post:
      operationId: backfillSiteIntegration
      security: [{ cookieAuth: [] }]
      summary: Re-import the last days in bounded windows
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationBackfillRequest' } } } }
      responses:
        '202': { description: Backfill scheduled. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/sites/{site}/integrations/{provider}:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      - { name: provider, in: path, required: true, schema: { type: string, maxLength: 32 } }
    delete:
      operationId: disconnectSiteIntegration
      security: [{ cookieAuth: [] }]
      summary: Disconnect, deleting stored tokens and all imported data
      responses:
        '204': { description: Disconnected and data deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/integrations/{provider}/callback:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: integrationOAuthCallback
      security: [{ cookieAuth: [] }]
      summary: OAuth redirect target; consumes the state and redirects to the site settings
      parameters:
        - { name: code, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '303': { description: Redirect to the site integrations settings with a status query value. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/sites/{site}/search-console/top:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: getSearchConsoleTop
      security: [{ cookieAuth: [] }]
      summary: Top queries or pages from imported Search Console data
      parameters:
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [query, page] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200': { description: Aggregated rows., content: { application/json: { schema: { $ref: '#/components/schemas/SearchConsoleTop' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API key scopes include stats:read, profiles:read, replay:read, and
        data:export. Sensitive scopes are independent and must be explicitly
        issued; stats:read never implies them. Keys remain organization- and
        site-scoped. CSV exports require stats:read and data:export together.
    cookieAuth:
      type: apiKey
      in: cookie
      name: supermetry_session
  parameters:
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    GitHubStarsRepoID:
      name: repo_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GitHubStarsEventLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AdminUserID:
      name: user
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SiteID:
      name: site_id
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 42
    SitePathID:
      name: site_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    OrgPathID:
      name: org
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GoalPathID:
      name: goal_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FunnelPathID:
      name: funnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Period'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    StatsPeriod:
      name: period
      in: query
      required: true
      description: "custom requires both date_from and date_to; all is capped to the latest 366 days."
      schema:
        type: string
        pattern: '^(day|today|yesterday|7d|30d|month|last_month|6mo|12mo|year|all|custom)$'
        example: 30d
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date, example: '2026-09-01' }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date, example: '2026-09-30' }
    Timezone:
      name: timezone
      in: query
      description: IANA time zone; defaults to the site's time zone.
      schema: { type: string, example: Asia/Kolkata }
    Metrics:
      name: metrics
      in: query
      description: Comma-separated metric names. Endpoint defaults apply when omitted.
      schema: { type: string, example: visitors,pageviews }
    Filters:
      name: filter
      in: query
      description: "Repeat up to ten times as dimension:operator:value1,value2. Region and city accept place alone for any country or place,ISO-country-code for a scoped match, for example city:is:Paris,FR. Percent-encode each value component."
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items: { type: string, example: 'country:is:US,CA' }
    Compare:
      name: compare
      in: query
      schema: { type: string, pattern: '^previous_period$', example: previous_period }
    Format:
      name: format
      in: query
      schema: { type: string, pattern: '^(json|csv)$', default: json, example: csv }
    StatsLimit:
      name: limit
      in: query
      description: "1-1000, or all for a CSV export capped at 100,000 rows. CSV requires stats:read and data:export."
      schema:
        type: string
        pattern: '^(all|[1-9][0-9]{0,2}|1000)$'
        example: '100'
    ExportLimit:
      name: limit
      in: query
      description: "Set to all with CSV to stream up to 100,000 rows."
      schema: { type: string, pattern: '^all$', example: all }
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        example: eyJ2IjoxLCJrIjpbNDJdfQ
  headers:
    RateLimitLimit:
      description: Maximum tokens in this process-local API bucket; multi-process deployments enforce one bucket per process.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Whole tokens remaining in this process-local API bucket.
      schema:
        type: integer
        format: int64
    RateLimitReset:
      description: RFC 3339 time when this process-local API bucket is full again.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        format: int64
  responses:
    QueryResult:
      description: Query results
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryResponse'
        text/csv:
          example: |-
            page,visitors,pageviews
            /docs,42,77
          schema:
            type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HealthCheck:
      description: The check succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    ServiceUnavailable:
      description: The service is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    IntegrationConnection:
      type: object
      required: [id, provider, property, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string }
        property: { type: string }
        status: { type: string, enum: [active, reauth] }
        synced_through: { type: string, format: date }
        last_sync_at: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    IntegrationCatalogEntry:
      type: object
      required: [provider, name, available]
      properties:
        provider: { type: string }
        name: { type: string }
        available: { type: boolean }
        connection: { $ref: '#/components/schemas/IntegrationConnection' }
    IntegrationConnectRequest:
      type: object
      additionalProperties: false
      required: [property]
      properties:
        property: { type: string, minLength: 1, maxLength: 512 }
        backfill_days: { type: integer, minimum: 1, maximum: 485, default: 28 }
    IntegrationBackfillRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days: { type: integer, minimum: 1, maximum: 485 }
    IntegrationAuthorization:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    SearchConsoleTopRow:
      type: object
      required: [key, clicks, impressions, ctr, position]
      properties:
        key: { type: string }
        clicks: { type: integer, format: int64 }
        impressions: { type: integer, format: int64 }
        ctr: { type: number }
        position: { type: number }
    SearchConsoleTop:
      type: object
      required: [dimension, from, to, totals, rows]
      properties:
        dimension: { type: string, enum: [query, page] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: '#/components/schemas/SearchConsoleTopRow' }
        rows: { type: array, items: { $ref: '#/components/schemas/SearchConsoleTopRow' } }
    NotificationChannelKind:
      type: string
      enum: [email, webhook, slack, discord, telegram]
    DeliveryStatus:
      type: string
      enum: [pending, succeeded, failed]
    RevenueReportRow:
      type: object
      additionalProperties: false
      required: [key, orders, revenue, average_order_value]
      properties:
        key: { type: string, description: Group label; empty for direct or unknown. }
        orders: { type: integer, format: int64, minimum: 0 }
        revenue: { type: number, format: double }
        average_order_value: { type: number, format: double }
        unique_customers: { type: integer, format: int64, minimum: 0 }
        repeat_customers: { type: integer, format: int64, minimum: 0 }
        repeat_rate: { type: number, format: double, description: Percent of customers with two or more orders in the group. }
    RevenueReport:
      type: object
      additionalProperties: false
      required: [currency, breakdown, attribution, lookback_days, orders, revenue, average_order_value, visitors, revenue_per_visitor, truncated, rows]
      properties:
        currency: { type: string, description: Site revenue currency; empty when unconfigured. }
        breakdown: { type: string }
        attribution: { type: string }
        lookback_days: { type: integer }
        orders: { type: integer, format: int64, minimum: 0 }
        revenue: { type: number, format: double }
        average_order_value: { type: number, format: double }
        visitors: { type: integer, format: int64, minimum: 0, description: Daily visitors in the period (ids are re-salted daily). }
        revenue_per_visitor: { type: number, format: double }
        unique_customers: { type: integer, format: int64, minimum: 0 }
        repeat_customers: { type: integer, format: int64, minimum: 0 }
        repeat_rate: { type: number, format: double }
        truncated: { type: boolean }
        rows: { type: array, items: { $ref: '#/components/schemas/RevenueReportRow' } }
    RevenueCustomer:
      type: object
      additionalProperties: false
      required: [profile_id, external_id, orders, revenue, first_order_at, last_order_at]
      properties:
        profile_id: { type: integer, format: int64 }
        external_id: { type: string }
        orders: { type: integer, format: int64, minimum: 1 }
        revenue: { type: number, format: double }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }
    RevenueCustomersResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/RevenueCustomer' } } }
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, alert_id, site_id, channel_id, channel_kind, channel_name, status, attempts, fired_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        alert_id: { type: integer, format: int64 }
        site_id: { type: integer, format: int32 }
        channel_id: { type: integer, format: int64 }
        channel_kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        channel_name: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        attempts: { type: integer, minimum: 0 }
        error_text: { type: string, maxLength: 512 }
        fired_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationTemplateInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        subject: { type: string, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 4096 }
    NotificationTemplate:
      allOf:
        - $ref: '#/components/schemas/NotificationTemplateInput'
        - type: object
          required: [kind, is_default]
          properties:
            kind: { $ref: '#/components/schemas/NotificationChannelKind' }
            is_default: { type: boolean }
            updated_at: { type: string, format: date-time }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [history_retention_days]
      properties:
        history_retention_days: { type: integer, minimum: 1, maximum: 3650, default: 30 }
    NotificationTemplateList:
      type: object
      additionalProperties: false
      required: [data, settings, variables]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } }
        settings: { $ref: '#/components/schemas/NotificationSettings' }
        variables: { type: array, items: { type: string } }
    RenderedNotification:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        subject: { type: string }
        body: { type: string }
    AdminMembership:
      type: object
      additionalProperties: false
      required: [org_id, org_name, role]
      properties:
        org_id: { type: integer, format: int64 }
        org_name: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer] }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, name, instance_admin, disabled, password_reset_required, totp_enabled, created_at, memberships]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        instance_admin: { type: boolean }
        disabled: { type: boolean }
        password_reset_required: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
        memberships: { type: array, items: { $ref: '#/components/schemas/AdminMembership' } }
    AdminUserCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, maxLength: 200, description: Defaults to the part of the email before the at sign. }
        org_name: { type: string, maxLength: 100, description: 'When set, an organization with this name is created and the user owns it.' }
        send_reset: { type: boolean, description: 'Email a password-set link. When mail is not configured, the link is returned as reset_url instead.' }
    AdminUserCreated:
      type: object
      additionalProperties: false
      required: [id, email, name, instance_admin, disabled, password_reset_required, totp_enabled, created_at, memberships]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        instance_admin: { type: boolean }
        disabled: { type: boolean }
        password_reset_required: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
        memberships: { type: array, items: { $ref: '#/components/schemas/AdminMembership' } }
        reset_url: { type: string, description: One-time password-set link; present only when send_reset was set and mail is not configured. }
    AdminUsersResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } }
    AdminUserPatch:
      type: object
      additionalProperties: false
      properties:
        disabled: { type: boolean }
        password_reset_required: { type: boolean }
        instance_admin: { type: boolean }
    AdminOrganization:
      type: object
      additionalProperties: false
      required: [id, name, slug, member_count, site_count, site_limit, storage]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        member_count: { type: integer, format: int64, minimum: 0 }
        site_count: { type: integer, format: int64, minimum: 0 }
        site_limit: { type: integer, minimum: 0 }
        deleted_at: { type: string, format: date-time, description: Set while the organization is deleted. }
        restorable_until: { type: string, format: date-time, description: End of the restore grace period, set while the organization is deleted. }
        deleted_by_kind: { type: string, enum: [owner, instance_admin], description: Actor class for the current deletion lifecycle. }
        deleted_by_user_id: { type: integer, format: int64, description: User that initiated the current deletion lifecycle. }
        deleted_by_name: { type: string, description: Current display name of the user that initiated deletion. }
        storage:
          description: Published total for the measured non-erased sites, including restorable sites. When some sites have no snapshot yet (for example a site created after the run started) the total covers the measured ones and unmeasured_sites says how many are missing. Null only while no included site has a snapshot.
          anyOf: [{ $ref: '#/components/schemas/AdminStorageUsage' }, { type: 'null' }]
    AdminOrganizationsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminOrganization' } } }
    AdminSite:
      type: object
      additionalProperties: false
      required: [id, org_id, organization, public_id, name, retention_days, pageviews, storage]
      properties:
        id: { type: integer, format: int32 }
        org_id: { type: integer, format: int64 }
        organization: { type: string }
        public_id: { type: string }
        name: { type: string }
        retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
        pageviews: { type: integer, format: int64, minimum: 0 }
        last_event_at: { type: string, format: date-time }
        storage:
          description: Complete published site estimate. Null until the first reconciliation publishes a snapshot.
          anyOf: [{ $ref: '#/components/schemas/AdminSiteStorageUsage' }, { type: 'null' }]
    AdminSitesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminSite' } } }
    AdminOrganizationDetail:
      allOf:
        - { $ref: '#/components/schemas/AdminOrganization' }
        - type: object
          required: [members, sites]
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
            sites: { type: array, items: { $ref: '#/components/schemas/AdminSite' } }
    AdminStorageUsage:
      type: object
      additionalProperties: false
      required: [estimated_storage_bytes, database_bytes, replay_bytes, measured_at, measurement_version]
      properties:
        estimated_storage_bytes: { type: integer, format: int64, minimum: 0 }
        database_bytes: { type: integer, format: int64, minimum: 0 }
        replay_bytes: { type: integer, format: int64, minimum: 0 }
        measured_at: { type: string, format: date-time }
        measurement_version: { type: integer, minimum: 1 }
        unmeasured_sites:
          description: Number of included sites without a snapshot yet. Present only when positive, meaning the total is at least this value.
          type: integer
          format: int64
          minimum: 1
    AdminSiteStorageUsage:
      type: object
      additionalProperties: false
      required: [estimated_storage_bytes, database_bytes, replay_bytes, measured_at, measurement_version, hot_bytes, retained_bytes, auxiliary_bytes, replay_recording_bytes, replay_css_bytes]
      properties:
        estimated_storage_bytes: { type: integer, format: int64, minimum: 0 }
        database_bytes: { type: integer, format: int64, minimum: 0 }
        replay_bytes: { type: integer, format: int64, minimum: 0 }
        measured_at: { type: string, format: date-time }
        measurement_version: { type: integer, minimum: 1 }
        hot_bytes: { type: integer, format: int64, minimum: 0 }
        retained_bytes: { type: integer, format: int64, minimum: 0 }
        auxiliary_bytes: { type: integer, format: int64, minimum: 0 }
        replay_recording_bytes: { type: integer, format: int64, minimum: 0 }
        replay_css_bytes: { type: integer, format: int64, minimum: 0 }
    AdminSettings:
      type: object
      additionalProperties: false
      required: [signup_mode, replay_visible]
      properties:
        signup_mode: { type: string, enum: [invite, open] }
        replay_visible: { type: boolean }
    AdminSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        signup_mode: { type: string, enum: [invite, open] }
        replay_visible: { type: boolean }
    AdminTwoFactorPolicy:
      type: object
      additionalProperties: false
      required: [scope, grace_days]
      properties:
        scope: { type: string, enum: [off, instance_admins, owners_admins, everyone] }
        grace_days: { type: integer, minimum: 0, maximum: 30 }
    AdminTwoFactorExemption:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expires_at: { type: string, format: date-time }
    GitHubStarsRepo:
      type: object
      additionalProperties: false
      required: [id, org_id, repo, public_counter, enabled, time_zone, has_token, webhook_url, public_count_url, history_complete, created_at, last_webhook_at, last_reconcile_at, last_error]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64, description: The organization that tracks the repository. }
        repo: { type: string, description: Lowercase owner/name. }
        public_counter: { type: boolean, description: 'When true the GitHub-verified star count (the value the sync jobs last read from GitHub, not the webhook-updated live count) is readable without signing in at public_count_url; off by default. A repository never synced from GitHub is not served.' }
        enabled: { type: boolean }
        time_zone: { type: string }
        has_token: { type: boolean }
        webhook_url: { type: string, description: The URL to configure as the GitHub webhook payload URL. }
        public_count_url: { type: string, description: 'Public, unauthenticated endpoint returning {"stars":N} for this repository.' }
        history_complete: { type: boolean, description: False while the history import of a large repository is unfinished. }
        created_at: { type: string, format: date-time }
        last_webhook_at: { type: [string, 'null'], format: date-time }
        last_reconcile_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
    GitHubStarRepoLimit:
      type: object
      additionalProperties: false
      required: [limit, source, tracked]
      properties:
        limit: { type: [integer, 'null'], minimum: 0, description: Most repositories the organization may track; null means unlimited. }
        source: { type: string, enum: [org, default], description: org when the organization has its own limit, default when the instance default applies. }
        tracked: { type: integer, description: Repositories the organization tracks now. }
    GitHubStarRepoLimitInput:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit: { type: [integer, 'null'], minimum: 0, description: The cap; 0 allows none and null means unlimited. }
    GitHubStarsRepos:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/GitHubStarsRepo' } } }
    GitHubStarsRepoInput:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo: { type: string, description: owner/name }
        token: { type: string, description: Optional GitHub token for the daily sync. }
        time_zone: { type: string, description: IANA time zone for charts; defaults to UTC. }
        public_counter: { type: boolean, description: Publish the GitHub-verified star count at the public counter endpoint once a sync has read it from GitHub; defaults to false. }
    GitHubStarsAlertKind:
      type: string
      enum: [star_milestone, star_spike, unstar_surge, trending_entered, trending_left]
    GitHubStarsAlertSettings:
      type: object
      additionalProperties: false
      required: [events, channel_ids, event_kinds]
      properties:
        events: { type: object, additionalProperties: { type: boolean } }
        channel_ids: { type: array, items: { type: integer, format: int64 } }
        event_kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label, description]
            properties:
              kind: { $ref: '#/components/schemas/GitHubStarsAlertKind' }
              label: { type: string }
              description: { type: string }
    GitHubStarsAlertSettingsInput:
      type: object
      additionalProperties: false
      required: [events, channel_ids]
      properties:
        events: { type: object, additionalProperties: { type: boolean } }
        channel_ids: { type: array, maxItems: 20, items: { type: integer, format: int64 } }
    GitHubStarsAlertDelivery:
      type: object
      additionalProperties: false
      required: [channel_id, ok]
      properties:
        channel_id: { type: integer, format: int64 }
        ok: { type: boolean }
        error: { type: string }
    GitHubStarsRepoPatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        time_zone: { type: string }
        token: { type: string, description: Replaces the stored token when not empty. }
        clear_token: { type: boolean }
        public_counter: { type: boolean }
        trending_enabled: { type: boolean, description: Opts the repository in or out of the trending watcher; turning it off closes open episodes silently. }
    GitHubTrendingSighting:
      type: object
      additionalProperties: false
      required: [id, list_language, since, first_rank, best_rank, last_rank, first_seen_at, last_seen_at, left_at]
      properties:
        id: { type: integer, format: int64, description: Identifies the episode. }
        list_language: { type: string, description: Lowercase language of the list; empty for all languages. }
        since: { type: string, enum: [daily, weekly] }
        first_rank: { type: integer }
        best_rank: { type: integer }
        last_rank: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        left_at: { type: [string, 'null'], format: date-time, description: Null while the episode is open. }
    GitHubTrendingList:
      type: object
      additionalProperties: false
      required: [list_language, since, last_ok_at, last_error, parse_ok, entries, no_list_until]
      properties:
        list_language: { type: string }
        since: { type: string, enum: [daily, weekly] }
        last_ok_at: { type: [string, 'null'], format: date-time }
        last_error: { type: string }
        parse_ok: { type: boolean, description: False while the page cannot be read. }
        entries: { type: integer }
        no_list_until: { type: [string, 'null'], format: date-time, description: Set while GitHub has no list for this language. }
    GitHubTrendingStatus:
      type: object
      additionalProperties: false
      required: [enabled, language, status, last_checked_at, lists, deferred_lists, current, episodes]
      properties:
        enabled: { type: boolean }
        language: { type: string, description: Primary language last seen by the star tracker; empty when unknown. }
        status: { type: string, description: 'One of off, waiting, watching or unreadable.' }
        last_checked_at: { type: [string, 'null'], format: date-time }
        lists: { type: array, items: { $ref: '#/components/schemas/GitHubTrendingList' } }
        deferred_lists: { type: integer, description: Lists the last run postponed because of the per-run request cap. }
        current: { type: array, items: { $ref: '#/components/schemas/GitHubTrendingSighting' } }
        episodes: { type: array, description: 'Latest 50 episodes, newest first; open ones have left_at null.', items: { $ref: '#/components/schemas/GitHubTrendingSighting' } }
    GitHubStarsRepoSecret:
      type: object
      additionalProperties: false
      required: [repo, webhook_secret, webhook_url]
      properties:
        repo: { $ref: '#/components/schemas/GitHubStarsRepo' }
        webhook_secret: { type: string, description: Shown once; never returned again. }
        webhook_url: { type: string }
    GitHubStarsSummary:
      type: object
      additionalProperties: false
      required: [stars, forks, watchers, open_issues, updated_at, net_24h, net_7d, recorded]
      properties:
        stars: { type: integer }
        forks: { type: integer }
        watchers: { type: integer }
        open_issues: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
        net_24h: { type: integer }
        net_7d: { type: integer }
        recorded: { type: integer, description: Current stargazers on record; below stars while the history import of a large repository is still running. }
    GitHubStarsPoint:
      type: object
      additionalProperties: false
      required: [bucket, gained, lost, net, cumulative]
      properties:
        bucket: { type: string, format: date-time, description: Start of the bucket in the configured time zone. }
        gained: { type: integer }
        lost: { type: integer }
        net: { type: integer }
        cumulative: { type: integer }
    GitHubStarsSeries:
      type: object
      additionalProperties: false
      required: [time_zone, data]
      properties:
        time_zone: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/GitHubStarsPoint' } }
    GitHubStarsEvent:
      type: object
      additionalProperties: false
      required: [id, user_id, login, action, occurred_at, source]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        login: { type: string }
        action: { type: string, description: starred or unstarred. }
        occurred_at: { type: string, format: date-time }
        source: { type: string, description: webhook, backfill or reconcile. }
    GitHubStarsEvents:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/GitHubStarsEvent' } }
        next_cursor: { type: [string, 'null'] }
    GitHubStarsAnnotation:
      type: object
      additionalProperties: false
      required: [id, at, label, created_by]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        label: { type: string }
        created_by: { type: [integer, 'null'], format: int64 }
    GitHubStarsAnnotations:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/GitHubStarsAnnotation' } } }
    GitHubStarsAnnotationInput:
      type: object
      additionalProperties: false
      required: [at, label]
      properties:
        at: { type: string, format: date-time }
        label: { type: string, minLength: 1, maxLength: 200 }
    GitHubStarsErasure:
      type: object
      additionalProperties: false
      required: [deleted_events]
      properties:
        deleted_events: { type: integer, format: int64 }
    AdminAuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, target_type, target_id, metadata, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor_user_id: { type: integer, format: int64 }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: integer, format: int64 }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AdminAuditResponse:
      type: object
      additionalProperties: false
      required: [data]
