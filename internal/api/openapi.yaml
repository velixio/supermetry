          example: https://www.example.com/pricing
        referrer:
          type: string
          example: https://search.example/
        screen_width:
          type: integer
          minimum: 0
          maximum: 32767
          example: 1440
        props:
          type: object
          additionalProperties:
            type: string
          maxProperties: 30
          example: { plan: pro }
        engagement_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          example: 12500
        scroll_pct:
          type: integer
          minimum: 0
          maximum: 100
          example: 75
