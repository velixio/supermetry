openapi: 3.1.0
info:
  title: Panel Analytics API
  version: 1.0.0
  description: The versioned API for querying Panel analytics and operational health.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/public/v1/vitals/query:
    post:
      operationId: vitalsQuery
      summary: Query Web Vitals from raw events
      description: Returns p75 and rating shares for LCP, CLS, and INP. The requested range must be inside the site's raw-data retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalsRequest'
      responses:
        '200':
          description: Web Vitals results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/query:
    post:
      operationId: query
      summary: Run an analytics query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/stats/summary:
    get:
      operationId: statsSummary
      summary: Get summary metrics
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/stats/timeseries:
    get:
      operationId: statsTimeseries
      summary: Get a metrics time series
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Period'
        - name: interval
          in: query
          schema:
            type: string
            enum: [day]
            default: day
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/stats/breakdown:
    get:
      operationId: statsBreakdown
      summary: Get a dimension breakdown
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Period'
        - name: dimension
          in: query
          required: true
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/funnels/query:
    post:
      operationId: funnelQuery
      summary: Run a funnel query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelRequest'
      responses:
        '200':
          description: Funnel results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/realtime:
    get:
      operationId: realtime
      summary: Get active visitors and top pages
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Realtime analytics
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/sites:
    get:
      operationId: listSites
      summary: List accessible sites
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sites page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createSite
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: getSite
      summary: Get a site
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSite
      summary: Update a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSite
      summary: Delete a site
      responses:
        '204':
          description: Site deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/goals:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listGoals
      summary: List goals
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createGoal
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/goals/{goal_id}:
    parameters:
      - $ref: '#/components/parameters/GoalPathID'
    patch:
      operationId: updateGoal
      summary: Update a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '200':
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      responses:
        '204':
          description: Goal deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/funnels:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listFunnels
      summary: List saved funnels
      responses:
        '200':
          description: Funnels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedFunnel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createFunnel
      summary: Create a saved funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFunnelInput'
      responses:
        '201':
          description: Funnel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/funnels/{funnel_id}:
    parameters:
      - $ref: '#/components/parameters/FunnelPathID'
    patch:
      operationId: updateFunnel
      summary: Update a saved funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFunnelInput'
      responses:
        '200':
          description: Updated funnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFunnel
      summary: Delete a saved funnel
      responses:
        '204':
          description: Funnel deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/segments:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listSegments
      summary: List saved segments
      description: Requires the stats:read API-key scope for the requested site.
      responses:
        '200':
          description: Saved segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Segment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Check process health
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Check service readiness
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /metrics:
    get:
      operationId: metrics
      security: []
      summary: Get Prometheus metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SiteID:
      name: site_id
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    SitePathID:
      name: site_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    GoalPathID:
      name: goal_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FunnelPathID:
      name: funnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Period'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        format: int64
    RateLimitReset:
      description: RFC 3339 time when the current window resets.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        format: int64
  responses:
    QueryResult:
      description: Query results
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryResponse'
        text/csv:
          schema:
            type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HealthCheck:
      description: The check succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    ServiceUnavailable:
      description: The service is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Site:
      type: object
      additionalProperties: false
      required: [id, org_id, public_id, name, timezone, retention_days, allowed_hosts]
      properties:
        id: { type: integer, format: int32 }
        org_id: { type: integer, format: int64 }
        public_id: { type: string }
        name: { type: string }
        timezone: { type: string }
        retention_days: { type: integer }
        allowed_hosts:
          type: array
          items: { type: string }
    SiteList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        next_cursor:
          type: [string, 'null']
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, hosts, timezone, retention_days]
      properties:
        name: { type: string }
        hosts:
          type: array
          minItems: 1
          items: { type: string }
        timezone: { type: string }
        retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
    UpdateSiteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        hosts:
          type: array
          minItems: 1
          items: { type: string }
        timezone: { type: string }
        retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
    GoalInput:
      type: object
      additionalProperties: false
      required: [kind, match, value, name]
      properties:
        kind:
          type: string
          enum: [page, event]
          x-enum-varnames: [GoalInputPage, GoalInputEvent]
        match: { type: string, enum: [exact, prefix, wildcard] }
        value: { type: string }
        prop_key: { type: string }
        prop_value: { type: string }
        name: { type: string }
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
    Goal:
      type: object
      additionalProperties: false
      required: [id, site_id, kind, match, value, name]
      properties:
        id: { type: integer, format: int64 }
        site_id: { type: integer, format: int32 }
        kind: { type: string }
        match: { type: string }
        value: { type: string }
        prop_key: { type: string }
        prop_value: { type: string }
        name: { type: string }
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
    SavedFunnelInput:
      type: object
      additionalProperties: false
      required: [name, steps]
      properties:
        name: { type: string }
        steps:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FunnelStep'
    SavedFunnel:
      allOf:
        - $ref: '#/components/schemas/SavedFunnelInput'
        - type: object
          required: [id, site_id]
          properties:
            id: { type: integer, format: int64 }
            site_id: { type: integer, format: int32 }
    Segment:
      type: object
      additionalProperties: false
      required: [id, site_id, name, filters, created_by, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        site_id: { type: integer, format: int32 }
        name: { type: string, minLength: 1, maxLength: 80 }
        filters:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Filter'
        created_by:
          type: [integer, 'null']
          format: int64
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Period:
      type: string
      enum: [today, yesterday, 7d, 30d, month, last_month, 12mo, year, custom]
    DateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    Metric:
      type: string
      enum:
        - visitors
        - visits
        - pageviews
        - views_per_visit
        - bounce_rate
        - visit_duration
        - engagement_time
        - scroll_depth
        - events
        - conversions
        - conversion_rate
        - total_revenue
        - average_revenue
    Filter:
      type: object
      additionalProperties: false
      required: [dimension, operator, values]
      properties:
        dimension:
          type: string
        operator:
          type: string
          enum: [is, is_not, contains, starts_with]
        values:
          type: array
          minItems: 1
          items:
            type: string
    OrderBy:
      type: object
      additionalProperties: false
      required: [column]
      properties:
        column:
          type: string
        direction:
          type: string
          enum: [asc, desc]
          default: desc
    QueryRequest:
      type: object
      additionalProperties: false
      required: [site_id, metrics]
      properties:
        site_id:
          type: integer
          format: int32
          minimum: 1
        date_range:
          $ref: '#/components/schemas/DateRange'
        period:
          $ref: '#/components/schemas/Period'
        timezone:
          type: string
        metrics:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Metric'
        dimensions:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        order_by:
          type: array
          items:
            $ref: '#/components/schemas/OrderBy'
        limit:
          type: integer
          minimum: 1
        cursor:
          type: string
        compare:
          type: string
          enum: [previous_period, previous_year]
    QueryMeta:
      type: object
      additionalProperties: false
      required: [sources_used, cached]
      properties:
        sources_used:
          type: array
          items:
            type: string
        cached:
          type: boolean
    QueryResponse:
      type: object
      additionalProperties: false
      required: [columns, rows, totals, meta]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          additionalProperties:
            type: number
            format: double
        next_cursor:
          type: string
        meta:
          $ref: '#/components/schemas/QueryMeta'
    VitalsDimension:
      type: string
      enum: [page, device, country, browser]
      x-enum-varnames: [VitalsDimensionPage, VitalsDimensionDevice, VitalsDimensionCountry, VitalsDimensionBrowser]
    VitalsRequest:
      type: object
      additionalProperties: false
      required: [site_id, date_range]
      properties:
        site_id:
          type: integer
          format: int32
          minimum: 1
        date_range:
          $ref: '#/components/schemas/DateRange'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        dimension:
          $ref: '#/components/schemas/VitalsDimension'
    VitalMetric:
      type: object
      additionalProperties: false
      required: [samples, good, needs_improvement, poor]
      properties:
        p75:
          type: number
          format: double
        samples:
          type: integer
          format: int64
          minimum: 0
        good:
          type: number
          format: double
          minimum: 0
          maximum: 1
        needs_improvement:
          type: number
