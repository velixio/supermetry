        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/v1/goals/{goal_id}:
    parameters:
      - $ref: '#/components/parameters/GoalPathID'
    patch:
      operationId: updateGoal
      summary: Update a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '200':
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      responses:
        '204':
          description: Goal deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/funnels:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listFunnels
      summary: List saved funnels
      responses:
        '200':
          description: Funnels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedFunnel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createFunnel
      summary: Create a saved funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFunnelInput'
      responses:
        '201':
          description: Funnel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/funnels/{funnel_id}:
    parameters:
      - $ref: '#/components/parameters/FunnelPathID'
    patch:
      operationId: updateFunnel
      summary: Update a saved funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFunnelInput'
      responses:
        '200':
          description: Updated funnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFunnel
      summary: Delete a saved funnel
      responses:
        '204':
          description: Funnel deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/segments:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listSegments
      summary: List saved segments
      description: Requires the stats:read API-key scope for the requested site.
      responses:
        '200':
          description: Saved segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Segment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createSegment
      summary: Create a saved segment
      description: Requires segments:write or sites:write. The mutation is recorded in the organization audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentInput' }
      responses:
        '201':
          description: Segment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Segment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A segment with the same name already exists. }
  /api/public/v1/segments/{segment_id}:
    parameters:
      - name: segment_id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      operationId: updateSegment
      summary: Update a saved segment
      description: Requires segments:write or sites:write. The mutation is recorded in the organization audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentInput' }
      responses:
        '200':
          description: Segment updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Segment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A segment with the same name already exists. }
    delete:
      operationId: deleteSegment
      summary: Delete a saved segment
      description: Requires segments:write or sites:write. The mutation is recorded in the organization audit log.
      responses:
        '204': { description: Segment deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/v1/sites/{site_id}/events:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: from
        in: query
        required: true
        schema: { type: string, format: date, example: '2026-10-01' }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date, example: '2026-10-08' }
      - name: name
        in: query
        schema: { type: string, maxLength: 2000, example: signup }
      - $ref: '#/components/parameters/Filters'
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    get:
      operationId: listEvents
      summary: Explore raw pageviews and custom events
      description: Requires stats:read. Results are newest first and limited to the site's raw-data retention window. Visitor identifiers, IP addresses, and user agents are never returned.
      responses:
        '200':
          description: A page of raw events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventExploreList' }
              example:
                data:
                  - { ts: '2026-10-08T12:30:00Z', kind: event, name: signup, page: /pricing, props: { plan: pro }, country: US, device: desktop, browser: Chrome, source: Google }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/v1/sites/{site_id}/properties:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: from
        in: query
        required: true
        schema: { type: string, format: date }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date }
      - name: event
        in: query
        schema: { type: string, maxLength: 2000 }
    get:
      operationId: listProperties
      summary: List property keys and event counts
      description: Requires stats:read. Returns at most 100 keys from raw events.
      responses:
        '200':
          description: Property keys ordered by event count
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/PropertyKeyCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/v1/sites/{site_id}/properties/{property_key}/values:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: property_key
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 2000 }
      - name: from
        in: query
        required: true
        schema: { type: string, format: date }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date }
      - name: event
        in: query
        schema: { type: string, maxLength: 2000 }
    get:
      operationId: listPropertyValues
      summary: List top property values and event counts
      description: Requires stats:read. Returns at most 100 values from raw events.
      responses:
        '200':
          description: Property values ordered by event count
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/PropertyValueCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/v1/sites/{site_id}/suggestions:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: dimension
        in: query
        required: true
        schema: { type: string, example: page }
      - name: q
        in: query
        schema: { type: string, maxLength: 2000 }
      - name: from
        in: query
        required: true
        schema: { type: string, format: date }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date }
    get:
      operationId: listSuggestions
      summary: Suggest filter values
      description: Requires stats:read. Prefix matches rank ahead of substring matches; the response is capped at 20 values.
      responses:
        '200':
          description: Matching values
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: '#/components/schemas/Suggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Check process health
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Check service readiness
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /metrics:
    get:
      operationId: metrics
      security: []
      summary: Get Prometheus metrics
      description: >-
        When SUPERMETRY_METRICS_TOKEN is set, requires Authorization: Bearer <token> and
        returns 401 for missing or invalid credentials. When the token is unset,
        only loopback clients (resolved through SUPERMETRY_TRUSTED_PROXIES) can access
        metrics; other clients receive 404. Health and readiness endpoints remain public.
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys for the caller's organization
      description: Requires keys:manage. Secret values and hashes are never returned.
      responses:
        '200':
          description: API keys in the caller's organization
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createApiKey
      summary: Create a narrower API key
      description: Requires keys:manage. Scopes, site access, and expiry cannot exceed the caller key; keys:manage itself cannot be delegated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created; the secret is returned only in this response.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Requires keys:manage. A key may revoke itself. IDs outside the caller's organization return 404.
      responses:
        '204':
          description: API key revoked
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API key scopes include stats:read, profiles:read, replay:read, and
        data:export. Sensitive scopes are independent and must be explicitly
        issued; stats:read never implies them. Keys remain organization- and
        site-scoped. CSV exports require stats:read and data:export together.
    cookieAuth:
      type: apiKey
      in: cookie
      name: supermetry_session
  parameters:
    SiteID:
      name: site_id
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 42
    SitePathID:
      name: site_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    OrgPathID:
      name: org
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GoalPathID:
      name: goal_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FunnelPathID:
      name: funnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Period'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    StatsPeriod:
      name: period
      in: query
      required: true
      description: "custom requires both date_from and date_to; all is capped to the latest 366 days."
      schema:
        type: string
        pattern: '^(day|today|yesterday|7d|30d|month|last_month|6mo|12mo|year|all|custom)$'
        example: 30d
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date, example: '2026-09-01' }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date, example: '2026-09-30' }
    Timezone:
      name: timezone
      in: query
      description: IANA time zone; defaults to the site's time zone.
      schema: { type: string, example: Asia/Kolkata }
    Metrics:
      name: metrics
      in: query
      description: Comma-separated metric names. Endpoint defaults apply when omitted.
      schema: { type: string, example: visitors,pageviews }
    Filters:
      name: filter
      in: query
      description: "Repeat up to ten times as dimension:operator:value1,value2. Region and city accept place alone for any country or place,ISO-country-code for a scoped match, for example city:is:Paris,FR. Percent-encode each value component."
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items: { type: string, example: 'country:is:US,CA' }
    Compare:
      name: compare
      in: query
      schema: { type: string, pattern: '^previous_period$', example: previous_period }
    Format:
      name: format
      in: query
      schema: { type: string, pattern: '^(json|csv)$', default: json, example: csv }
    StatsLimit:
      name: limit
      in: query
      description: "1-1000, or all for a CSV export capped at 100,000 rows. CSV requires stats:read and data:export."
      schema:
        type: string
        pattern: '^(all|[1-9][0-9]{0,2}|1000)$'
        example: '100'
    ExportLimit:
      name: limit
      in: query
      description: "Set to all with CSV to stream up to 100,000 rows."
      schema: { type: string, pattern: '^all$', example: all }
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        example: eyJ2IjoxLCJrIjpbNDJdfQ
  headers:
    RateLimitLimit:
      description: Maximum tokens in this process-local API bucket; multi-process deployments enforce one bucket per process.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Whole tokens remaining in this process-local API bucket.
      schema:
        type: integer
        format: int64
    RateLimitReset:
      description: RFC 3339 time when this process-local API bucket is full again.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        format: int64
  responses:
    QueryResult:
      description: Query results
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryResponse'
        text/csv:
          example: |-
            page,visitors,pageviews
            /docs,42,77
          schema:
            type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HealthCheck:
      description: The check succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    ServiceUnavailable:
      description: The service is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        deleted_at: { type: [string, 'null'], format: date-time }
        purge_at: { type: [string, 'null'], format: date-time }
    DeletionResult:
      type: object
      additionalProperties: false
      required: [scheduled, purge_at]
      properties:
        scheduled: { type: boolean }
        purge_at: { type: [string, 'null'], format: date-time }
    DeletedSite:
      type: object
      additionalProperties: false
      required: [id, name, deleted_at, purge_at]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
        deleted_at: { type: string, format: date-time }
        purge_at: { type: string, format: date-time }
    DeletedOrganization:
      type: object
      additionalProperties: false
      required: [id, name, slug, deleted_at, purge_at, sites]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        deleted_at: { type: string, format: date-time }
        purge_at: { type: string, format: date-time }
        sites:
          type: array
          items: { type: string }
    LifecycleError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_name, not_restorable]
    CreateDemoRequest:
      type: object
      additionalProperties: false
      required: [timezone]
      properties:
        timezone: { type: string, example: Europe/Berlin }
    DemoError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_timezone, demo_exists]
        site_id:
          type: string
          description: Existing public site identifier, present for demo_exists.
    CurrentUserResponse:
      type: object
      required: [user, memberships, demo_prompt_dismissed, version]
      properties:
        user:
          type: object
          required: [id, email, name, totp_enabled, created_at]
          properties:
            id: { type: integer, format: int64 }
            email: { type: string, format: email }
            name: { type: string }
            totp_enabled: { type: boolean }
            created_at: { type: string, format: date-time }
            last_login_at: { type: string, format: date-time }
        memberships:
          type: array
          items:
            type: object
            required: [org, role, site_ids, capabilities, billing_admin, effective_capabilities, sites]
            properties:
              org:
                type: object
                required: [id, name, slug]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
                  slug: { type: string }
