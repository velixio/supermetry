openapi: 3.1.0
info:
  title: Supermetry Analytics API
  version: 1.0.0
  description: >-
    The versioned API for querying Supermetry analytics and operational health.
    stats:read grants ordinary analytics only. Identified profiles require
    profiles:read, recordings require replay:read, and any CSV export (Accept:
    text/csv, format=csv, or limit=all) additionally requires data:export.
    Sensitive exports also require their corresponding read scopes. Existing
    stats-only keys and shared dashboards receive no sensitive or export grants.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/private/setup/status:
    get:
      operationId: getSetupStatus
      security: []
      summary: Check whether first-run setup is available
      description: Returns only whether the one-time setup flow is still available. Authentication does not change the response.
      responses:
        '200':
          description: Setup availability.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available]
                properties:
                  available: { type: boolean }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/private/me:
    get:
      operationId: getCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Get the signed-in user and memberships
      responses:
        '200':
          description: Current account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Update the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 1 } }
      responses:
        '200': { description: Updated identity. }
        '403': { description: A valid CSRF cookie and header are required. }
    delete:
      operationId: deleteCurrentUser
      security: [{ cookieAuth: [] }]
      summary: Delete the signed-in account
      description: Anonymises the user row so audit actor IDs and invitations remain, and removes memberships and sessions. Refused while the user is an organization's last owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Account anonymised and authentication cookies cleared. }
        '409': { description: Transfer ownership or delete the organization first. }
        '429': { description: Too many password checks. }
  /api/private/me/demo-prompt/dismiss:
    post:
      operationId: dismissDemoPrompt
      security: [{ cookieAuth: [] }]
      summary: Permanently dismiss the demo-project onboarding prompt
      responses:
        '204': { description: The prompt is dismissed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/private/me/orgs/deleted:
    get:
      operationId: listDeletedOrganizations
      security: [{ cookieAuth: [] }]
      summary: List restorable organizations owned by the signed-in user
      responses:
        '200':
          description: Organizations scheduled for deletion.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletedOrganization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/private/me/orgs/{org}/restore:
    post:
      operationId: restoreOrganization
      security: [{ cookieAuth: [] }]
      summary: Restore an owned organization during its deletion grace period
      parameters:
        - $ref: '#/components/parameters/OrgPathID'
      responses:
        '204': { description: Organization restored. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The organization is outside its grace period or has been erased.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleError' }
  /api/private/orgs/{org}/demo:
    post:
      operationId: createDemoProject
      security: [{ cookieAuth: [] }]
      summary: Create and start seeding the organization's demo project
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoRequest'
      responses:
        '202':
          description: The demo project was created and its background seed was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: The timezone is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The organization already has a demo project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
  /api/private/orgs/{org}:
    parameters:
      - $ref: '#/components/parameters/OrgPathID'
    patch:
      operationId: renameOrganization
      security: [{ cookieAuth: [] }]
      summary: Rename an organization without changing its slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Renamed organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400':
          description: The organization name is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteOrganization
      security: [{ cookieAuth: [] }]
      summary: Schedule or immediately delete an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Deletion accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/orgs/{org}/sites/deleted:
    get:
      operationId: listDeletedSites
      security: [{ cookieAuth: [] }]
      summary: List restorable sites in an organization
      parameters:
        - $ref: '#/components/parameters/OrgPathID'
      responses:
        '200':
          description: Sites scheduled for deletion.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletedSite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    delete:
      operationId: deletePrivateSite
      security: [{ cookieAuth: [] }]
      summary: Schedule or immediately delete a site
      responses:
        '200':
          description: Deletion accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/restore:
    post:
      operationId: restoreSite
      security: [{ cookieAuth: [] }]
      summary: Restore a site during its deletion grace period
      parameters:
        - $ref: '#/components/parameters/SitePathID'
      responses:
        '204': { description: Site restored. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The site cannot be restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleError' }
  /api/private/sites/{site}/demo/heartbeat:
    post:
      operationId: heartbeatDemoProject
      security: [{ cookieAuth: [] }]
      summary: Keep watched demo traffic active
      parameters:
        - name: site
          in: path
          required: true
          schema: { type: integer, format: int32 }
      responses:
        '204': { description: The demo heartbeat was recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/me/email:
    post:
      operationId: startCurrentUserEmailChange
      security: [{ cookieAuth: [] }]
      summary: Send an email-change confirmation
      description: Requires SMTP. The one-time confirmation token expires after one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '202': { description: Accepted. A confirmation is sent to the new address unless it is already registered; the response is the same either way. }
        '409': { description: SMTP is not configured. }
        '429': { description: Too many password checks. }
  /api/private/auth/email-change/confirm:
    get:
      operationId: confirmCurrentUserEmailChangeLink
      security: [{ cookieAuth: [] }]
      summary: Confirm an email change from a link
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '303': { description: "Redirects to the login page without the requesting user's session, else to the profile page with email_changed=1 (changed, old address notified) or email_changed=0 (token invalid, expired, used, or for another user)." }
    post:
      operationId: confirmCurrentUserEmailChange
      security: [{ cookieAuth: [] }]
      summary: Confirm an email change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '204': { description: Email changed and old address notified. }
        '400': { description: Token is invalid, expired, already used, or belongs to another user. }
        '401': { description: The requesting user's session is required. }
  /api/private/me/password:
    post:
      operationId: changeCurrentUserPassword
      security: [{ cookieAuth: [] }]
      summary: Change the signed-in user's password
      description: Revokes every other session and keeps the current session active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed and other sessions revoked. }
        '429': { description: Too many password checks. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/private/sites/{site_id}/shares:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listSharedLinks
      security: [{ cookieAuth: [] }]
      summary: List shared dashboard links
      responses:
        '200': { description: Shared dashboard links, content: { application/json: { schema: { $ref: '#/components/schemas/ShareList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSharedLink
      security: [{ cookieAuth: [] }]
      summary: Create a shared dashboard link
      description: When expires_in_days is omitted or null, the link never expires.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateShareRequest' } } }
      responses:
        '201': { description: Shared dashboard link created, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedShare' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/shares/{share_id}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: share_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      operationId: changeSharedLinkExpiry
      security: [{ cookieAuth: [] }]
      summary: Change a shared dashboard link expiry
      description: The new expiry is counted from now. Null removes the expiry.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeShareExpiryRequest' } } }
      responses:
        '204': { description: Expiry changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeSharedLink
      security: [{ cookieAuth: [] }]
      summary: Revoke a shared dashboard link
      responses:
        '204': { description: Link revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/share/{slug}/open:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: openSharedLink
      security: []
      summary: Unlock a password-protected shared dashboard
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenShareRequest' } } }
      responses:
        '204': { description: Link opened; protected links set an unlock cookie. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/sites/{site_id}/replays:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listReplays
      security: [{ cookieAuth: [] }]
      summary: List session replays
      description: Requires replay.read. Profile identifiers are null unless profiles.read is also granted.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Replay page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replays/{session_id}/data:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: session_id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
    get:
      operationId: getReplayData
      security: [{ cookieAuth: [] }]
      summary: Download replay events
      description: Requires replay.read for the requested site. Recording access never enables collection or changes instance privacy settings.
      responses:
        '200':
          description: A gzip-compressed NDJSON event stream
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replays/css/{hash}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: hash, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
    get:
      operationId: getReplayCSS
      security: [{ cookieAuth: [] }]
      summary: Download a replay stylesheet
      description: Requires replay.read for the requested site; stylesheet hashes are isolated per site.
      responses:
        '200':
          description: A gzip-compressed stylesheet
          content:
            text/css:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replay-settings:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: getReplaySettings
      security: [{ cookieAuth: [] }]
      summary: Get site replay settings
      responses:
        '200': { description: Resolved settings and environment locks, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaySiteSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateReplaySettings
      security: [{ cookieAuth: [] }]
      summary: Replace site replay settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaySiteSettingsInput' }
      responses:
        '200': { description: Resolved settings, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaySiteSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A submitted field is locked by an environment variable. }
  /api/private/instance/replay-storage:
    get:
      operationId: getReplayStorage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Get instance replay storage settings
      responses:
        '200': { description: Resolved storage settings without the S3 secret, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayStorageSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateReplayStorage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Replace instance replay storage settings
      description: migrate records a background migration request; migration execution is asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayStorageInput' }
      responses:
        '200': { description: Resolved storage settings, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayStorageSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A submitted field is locked by an environment variable. }
  /api/public/v1/events:
    post:
      operationId: submitEvent
      security: []
      summary: Submit an analytics event
      description: |
        Public event intake; no API key is required. Requests are counted against
        per-site and per-visitor-address rate limits. Deployments may configure a
        different path with `SUPERMETRY_EVENT_PATH`.

        When calling this endpoint through a reverse proxy, forward the visitor's
        address with `X-Forwarded-For` only when that proxy is listed in
        `SUPERMETRY_TRUSTED_PROXIES`. Forward the visitor's `User-Agent` as well so
        device dimensions and bot filtering remain accurate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
          text/plain:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '202':
          description: The event was accepted for processing.
        '400':
          description: The payload, site, page URL, or client address is invalid.
        '429':
          description: The site or visitor-address rate limit was exceeded.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '503':
          description: Event intake is unavailable or its bounded queue is full.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |-
            curl --request POST https://analytics.example.com/api/public/v1/events \
              --header 'Content-Type: application/json' \
              --header 'User-Agent: Mozilla/5.0' \
              --header 'X-Forwarded-For: 203.0.113.10' \
              --data '{"site":"my-site","name":"pageview","url":"https://www.example.com/pricing"}'
        - lang: JavaScript
          label: fetch
          source: |-
            await fetch('https://analytics.example.com/api/public/v1/events', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'User-Agent': visitorUserAgent,
                // Only send this through a proxy listed in SUPERMETRY_TRUSTED_PROXIES.
                'X-Forwarded-For': visitorAddress,
              },
              body: JSON.stringify({
                site: 'my-site',
                name: 'pageview',
                url: 'https://www.example.com/pricing',
              }),
            });
  /api/public/v1/heatmaps/query:
    post:
      operationId: heatmapQuery
      summary: Query an aggregated click heatmap and scroll map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapRequest'
      responses:
        '200':
          description: Aggregated heatmap results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/vitals/query:
    post:
      operationId: vitalsQuery
      summary: Query Web Vitals from raw events
      description: Returns overall and breakdown p75/rating shares plus daily p50, p75, p95, and sample counts for LCP, CLS, and INP. Daily buckets use the site's timezone. The requested range must be inside the raw-data retention window, end no later than the current site-local day, and span at most 366 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalsRequest'
      responses:
        '200':
          description: Web Vitals results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/query:
    post:
      operationId: query
      summary: Run an analytics query
      description: "Set Accept: text/csv or format=csv for CSV. With CSV, limit=all streams cursor pages up to 100,000 rows."
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/ExportLimit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
            text/csv:
              schema:
                type: string
        '400':
