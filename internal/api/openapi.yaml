      properties:
        slug: { type: string }
        share: { $ref: '#/components/schemas/Share' }
    APIKey:
      type: object
      additionalProperties: false
      required: [id, name, scopes, site_ids, created_at, expires_at, last_used_at, revoked]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        site_ids:
          type: [array, 'null']
          items: { type: integer, format: int32 }
          description: Null grants every site in the organization; an empty array grants none.
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked: { type: boolean }
    APIKeyList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1 }
        scopes:
          type: array
          items: { type: string }
        site_ids:
          type: array
          items: { type: integer, format: int32 }
        expires_at: { type: string, format: date-time }
    CreatedAPIKey:
      type: object
      additionalProperties: false
      required: [id, key]
      properties:
        id: { type: integer, format: int64 }
        key:
          type: string
          description: The secret value. It is shown once and cannot be retrieved later.
    MCPMessage:
      oneOf:
        - $ref: '#/components/schemas/MCPRequest'
        - $ref: '#/components/schemas/MCPResponse'
    MCPRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        method: { type: string, minLength: 1 }
        params: {}
    MCPError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
        data: {}
    MCPResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id]
      oneOf:
        - required: [result]
        - required: [error]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        result: {}
        error:
          $ref: '#/components/schemas/MCPError'
    AnnotationInput:
      type: object
      additionalProperties: false
      required: [day, text]
      properties:
        day: { type: string, format: date }
        text: { type: string, minLength: 1, maxLength: 200 }
    AnnotationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        day: { type: string, format: date }
        text: { type: string, minLength: 1, maxLength: 200 }
    EventPayload:
      type: object
      required: [site, name]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
          description: Client event identifier used for bounded retry deduplication.
        ts:
          type: integer
          format: int64
          description: Client event time in Unix milliseconds.
        v:
          type: integer
          enum: [1]
          description: Event payload contract version.
        site:
          type: string
          description: Public site identifier.
          example: my-site
        name:
          type: string
          description: Event name, such as pageview or a custom event name.
          example: pageview
        url:
          type: string
          format: uri
          description: Full page URL. Required by the event intake handler.
          example: https://www.supermetry.com/pricing
        referrer:
          type: string
          example: https://search.example/
        screen_width:
          type: integer
          minimum: 0
          maximum: 32767
          example: 1440
        props:
          type: object
          additionalProperties:
            type: string
          maxProperties: 30
          example: { plan: pro }
        engagement_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          example: 12500
        scroll_pct:
          type: integer
          minimum: 0
          maximum: 100
          example: 75
        revenue:
          type: object
          required: [amount, currency]
          properties:
            amount:
              oneOf:
                - type: number
                - type: string
              example: '29.99'
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              example: USD
        traits:
          type: object
          description: Profile traits for an identify event on a profiles-enabled site.
          additionalProperties:
            type: string
          maxProperties: 20
          example: { plan: pro }
        profile_id:
          type: string
          description: External profile identifier for a profiles-enabled site.
          maxLength: 128
          example: customer-123
    Site:
      type: object
      additionalProperties: false
      required: [id, org_id, public_id, kind, slug, name, timezone, retention_days, allowed_hosts, exclude_ips, exclude_paths, profiles_enabled, heatmaps_enabled, respect_privacy_signals, strict_origin, blocked_referrers, revenue_currency_state, install_status, last_seen_at, is_demo, demo_ready]
      properties:
        id: { type: integer, format: int32 }
        org_id: { type: integer, format: int64 }
        public_id: { type: string }
        kind: { type: string, enum: [web, pixel] }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', minLength: 1, maxLength: 63, description: Readable per-organization URL segment; public_id resolves too. }
        name: { type: string }
        timezone: { type: string }
        retention_days: { type: integer }
        profiles_enabled: { type: boolean, default: false }
        allowed_hosts:
          type: array
          items: { type: string }
        exclude_ips:
          type: array
          items: { type: string }
        exclude_paths:
          type: array
          items: { type: string }
        heatmaps_enabled: { type: boolean }
        respect_privacy_signals:
          type: boolean
          default: true
          description: When true, event ingestion drops requests carrying Sec-GPC 1 or DNT 1.
        strict_origin:
          type: boolean
          default: false
          description: Require an allowed Origin or Referer host during browser event ingestion.
        blocked_referrers:
          type: array
          maxItems: 200
          description: Site-specific referrer domains to classify as spam; subdomains also match.
          items: { type: string }
        revenue_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        revenue_currency_state:
          type: string
          enum: [unconfigured, configured, conflict]
          x-enum-varnames: [SiteRevenueCurrencyUnconfigured, SiteRevenueCurrencyConfigured, SiteRevenueCurrencyConflict]
        install_status:
          type: string
          enum: [waiting, receiving, quiet]
          x-enum-varnames: [SiteInstallStatusWaiting, SiteInstallStatusReceiving, SiteInstallStatusQuiet]
          description: Derived from the site's most recent accepted event.
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the site's most recent accepted event, or null before the first event.
        is_demo: { type: boolean }
        demo_ready: { type: boolean }
        deleted_at: { type: [string, 'null'], format: date-time }
        purge_at: { type: [string, 'null'], format: date-time }
        demo_expires_at:
          type: string
          format: date-time
          description: Expiry time for a demo project; returned only by private endpoints.
    SiteList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        next_cursor:
          type: [string, 'null']
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, timezone]
      description: hosts are required when kind is web (the default); hosts and revenue_currency are ignored for pixel.
      properties:
        name: { type: string }
        kind: { type: string, enum: [web, pixel], default: web, description: Fixed at creation. }
        hosts:
          type: array
          items: { type: string }
        timezone: { type: string }
        retention_days:
          type: integer
          enum: [0, 7, 30, 90, 365]
          description: Raw-event retention in days; 0 keeps events forever. Omitted uses the instance default (SUPERMETRY_DEFAULT_RETENTION_DAYS). 0 is rejected with 400 when SUPERMETRY_RETENTION_FOREVER is false.
        revenue_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Permanent project currency. Omitted leaves it unconfigured; an owner or admin can set it once later.
    PixelInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        badge_label: { type: string, maxLength: 40 }
        enabled: { type: boolean }
    Pixel:
      type: object
      required: [id, public_id, name, badge_label, enabled, created_at, total, views_30d, gif_url, svg_url]
      properties:
        id: { type: integer, format: int64 }
        public_id: { type: string, pattern: '^p[A-Za-z0-9]{11}$' }
        name: { type: string }
        badge_label: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        total: { type: integer, format: int64, description: All-time views (views, not unique visitors). }
        views_30d: { type: integer, format: int64 }
        gif_url: { type: string, format: uri }
        svg_url: { type: string, format: uri }
    PixelStats:
      type: object
      required: [from, to, summary, daily, pixels, countries]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        summary:
          type: object
          description: Views for today, the last 7 and 30 days and all time in the site's time zone, independent of from and to.
          required: [today, last_7, last_30, total]
          properties: { today: { type: integer }, last_7: { type: integer }, last_30: { type: integer }, total: { type: integer } }
        daily:
          type: array
          items: { type: object, required: [day, proxy, direct], properties: { day: { type: string, format: date }, proxy: { type: integer }, direct: { type: integer } } }
        pixels:
          type: array
          items: { type: object, required: [pixel_id, views], properties: { pixel_id: { type: integer, format: int64 }, views: { type: integer } } }
        countries:
          type: array
          description: Direct views only; image proxies such as GitHub hide the country.
          items: { type: object, required: [country, views], properties: { country: { type: string }, views: { type: integer } } }
    ManagedTrackingPixelInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        tag:
          oneOf:
            - { type: string, maxLength: 0 }
            - { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$' }
          description: Omit or send an empty string to generate an eight-character tag.
    ManagedTrackingPixelPatch:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    ManagedTrackingPixel:
      type: object
      additionalProperties: false
      required: [id, site_id, name, tag, gif_url, svg_url, html, total, views_30d, created_at]
