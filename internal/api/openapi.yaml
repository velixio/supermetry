      properties:
        password: { type: string, format: password }
    Share:
      type: object
      additionalProperties: false
      required: [id, site_id, created_by, created_at, expires_at, password_protected, config]
      properties:
        id: { type: integer, format: int64 }
        site_id: { type: integer, format: int32 }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        password_protected: { type: boolean }
        config: { $ref: '#/components/schemas/ShareConfig' }
    ShareSection:
      type: string
