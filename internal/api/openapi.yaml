      summary: Run a retention query
      description: >-
        Requires stats:read; identity=profile additionally requires profiles:read.
        Visitor identity is linkable only within one local day. Offset n counts
        daily identities with at least n+1 sessions on that local day; week and
        month intervals group daily cohorts and do not link people across days.
