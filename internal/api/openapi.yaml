        segment_id: { type: integer, format: int64, minimum: 1 }
        date: { $ref: '#/components/schemas/ShareDateConfig' }
        theme: { $ref: '#/components/schemas/ShareTheme' }
        embed: { $ref: '#/components/schemas/ShareEmbedConfig' }
    ShareSectionRequest:
      type: object
      additionalProperties: false
      required: [section]
      properties:
        section: { $ref: '#/components/schemas/ShareSection' }
    SharedDashboard:
      type: object
      additionalProperties: false
      required: [sections, theme, date_label, transparent_background, data, read_only]
      properties:
        sections:
          type: array
          items: { $ref: '#/components/schemas/ShareSection' }
        theme: { $ref: '#/components/schemas/ShareTheme' }
        date_label: { type: string }
        transparent_background: { type: boolean }
        data: { $ref: '#/components/schemas/QueryResponse' }
        read_only: { type: boolean }
    ShareList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Share' }
    CreatedShare:
      type: object
