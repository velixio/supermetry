        config: { $ref: '#/components/schemas/ShareConfig' }
    ChangeShareExpiryRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_days:
          oneOf:
            - { $ref: '#/components/schemas/ShareExpiryDays' }
