          format: int64
          minimum: 0
        clock_skew_clamps:
          type: integer
          format: int64
          minimum: 0
        failed_profile_erasures:
          type: integer
          format: int64
          minimum: 0
        rollup_backfill:
          $ref: '#/components/schemas/RollupBackfillProgress'
        site_drops:
          type: array
          items: { $ref: '#/components/schemas/SiteDropHealth' }
        instance_scope:
          type: boolean
          description: True when the instance-wide counters in this response are populated (admin:read); false when only site_drops is filled for the caller's sites.
    SiteDropHealth:
      type: object
      additionalProperties: false
      required: [site_id, site_public_id, reasons, top_bot_rules]
      properties:
        site_id: { type: integer, format: int32 }
        site_public_id: { type: string }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/DropReasonHealth' }
        top_bot_rules:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/BotRuleCount' }
    DropReasonHealth:
      type: object
      additionalProperties: false
      required: [reason, today, previous_7_days, trailing_7_day_average, spike]
      properties:
        reason:
          type: string
          enum: [bot_user_agent, bot_headless, bot_spam_referrer, rate_limited_ip, rate_limited_site, rate_limited_global, privacy_signal, dimension_overflow, host_not_allowed, clock_skew]
        today: { type: integer, format: int64, minimum: 0 }
        previous_7_days: { type: integer, format: int64, minimum: 0 }
        trailing_7_day_average: { type: number, format: double, minimum: 0 }
        spike: { type: boolean }
    BotRuleCount:
      type: object
      additionalProperties: false
      required: [rule, count]
      properties:
        rule: { type: string, maxLength: 160 }
        count: { type: integer, format: int64, minimum: 0 }
    RollupBackfillProgress:
      type: object
      additionalProperties: false
      required: [status, days_done, total_days]
      properties:
        status:
          type: string
          enum: [running, finished]
        days_done:
          type: integer
          minimum: 0
        total_days:
          type: integer
          minimum: 0
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
        schema_version:
          type: integer
          format: int64
          minimum: 0
    ValidationError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      example:
        type: https://supermetry.com/problems/bad-request
        title: Bad request
        status: 400
        detail: period is required
