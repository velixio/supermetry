openapi: 3.1.0
info:
  title: Supermetry Analytics API
  version: 1.0.0
  description: >-
    The versioned API for querying Supermetry analytics and operational health.
    stats:read grants ordinary analytics only. Identified profiles require
    profiles:read, recordings require replay:read, and any CSV export (Accept:
    text/csv, format=csv, or limit=all) additionally requires data:export.
    Sensitive exports also require their corresponding read scopes. Existing
    stats-only keys and shared dashboards receive no sensitive or export grants.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/private/admin/users:
    get:
      operationId: adminListUsers
      security: [{ cookieAuth: [] }]
      summary: List and search instance users
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: '#/components/parameters/AdminLimit' }
      responses:
        '200': { description: Instance users., content: { application/json: { schema: { $ref: '#/components/schemas/AdminUsersResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: adminCreateUser
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Create a user with an unusable password, optionally with an organization they own
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserCreate' } } } }
      responses:
        '201': { description: Created user., content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserCreated' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A user with this email already exists., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/users/{user}:
    patch:
      operationId: adminUpdateUser
      security: [{ cookieAuth: [] }]
      summary: Enable, disable, force password reset, promote or demote a user
      parameters: [{ $ref: '#/components/parameters/AdminUserID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPatch' } } } }
      responses:
        '200': { description: Updated user., content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/users/{user}/impersonate:
    post:
      operationId: adminImpersonateUser
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Sign in as a user for support
      description: >-
        Opens a one-hour session as the user that activity never extends. The
        session cannot use the instance admin routes, change the account's
        password, email or two-factor settings, delete the account, revoke
        sessions, create API keys, send or accept invitations, change member
        roles, remove members, leave an organization, or create share links, notification channels, alerts or
        scheduled reports. Organization audit entries written during the
        session carry impersonated_by with the admin's user id. With a cookie session
        the admin re-enters their password (and TOTP code when enabled), and the
        response replaces the admin's session cookies. With the admin API key no
        body is needed and the session token is returned instead. Instance
        admins and disabled users cannot be signed in as; a user who must reset
        their password returns 409.
      parameters: [{ $ref: '#/components/parameters/AdminUserID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Session created through the admin API key., content: { application/json: { schema: { $ref: '#/components/schemas/AdminImpersonation' } } } }
        '204': { description: Session created; the session and CSRF cookies are set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The user must reset their password first., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/organizations:
    get:
      operationId: adminListOrganizations
      security: [{ cookieAuth: [] }]
      summary: List organizations, including restorable deletions, with member, site, quota and storage totals
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: '#/components/parameters/AdminLimit' }
      responses:
        '200': { description: Organizations., content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/organizations/{org}:
    get:
      operationId: adminGetOrganization
      security: [{ cookieAuth: [] }]
      summary: Get an organization with its members, sites, quota and storage total
      description: Also returns an organization in its restore grace period (deleted_at and restorable_until are set); erased organizations are 404.
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      responses:
        '200': { description: Organization details., content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: adminDeleteOrganization
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Delete an organization with the restorable deletion grace period
      description: Tombstones the organization and its sites; only an instance admin can restore it within the grace period. Organizations without real sites are erased at once. Audited as instance.organization.deleted.
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      responses:
        '204': { description: Organization deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/organizations/{org}/restore:
    post:
      operationId: adminRestoreOrganization
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Restore a deleted organization within the deletion grace period
      description: Restores an organization that is deleted, not erased and still inside the 7-day grace period, whoever deleted it, with its sites. Audited as instance.organization.restored. Returns 404 for an unknown or erased organization, and 409 not_restorable outside the grace period or when the organization is not deleted, or site_limit when restoring would exceed the site limit.
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      responses:
        '204': { description: Organization restored. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Conflict: error is not_restorable or site_limit.', content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string, enum: [not_restorable, site_limit] } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/sites:
    get:
      operationId: adminListSites
      security: [{ cookieAuth: [] }]
      summary: List sites with traffic, storage, last event and retention
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: '#/components/parameters/AdminLimit' }
      responses:
        '200': { description: Sites., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSitesResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/sites/{site_id}:
    patch:
      operationId: adminSetSiteRetention
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Set a site's retention class
      description: Moves the site to the given retention class, as an owner edit does. Audited as instance.site.retention_changed.
      parameters:
        - { name: site_id, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [retention_days]
              properties:
                retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
      responses:
        '200':
          description: Retention updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, retention_days]
                properties:
                  id: { type: integer, format: int32 }
                  retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/settings:
    get:
      operationId: adminGetSettings
      security: [{ cookieAuth: [] }]
      summary: Get effective instance settings
      responses:
        '200': { description: Instance settings., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: adminUpdateSettings
      security: [{ cookieAuth: [] }]
      summary: Change signup mode or replay-switch visibility
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettingsPatch' } } } }
      responses:
        '200': { description: Updated settings., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/security/2fa-policy:
    get:
      operationId: adminGetTwoFactorPolicy
      security: [{ cookieAuth: [] }]
      summary: Get the instance two-factor policy
      responses:
        '200': { description: Two-factor policy., content: { application/json: { schema: { $ref: '#/components/schemas/AdminTwoFactorPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: adminUpdateTwoFactorPolicy
      security: [{ cookieAuth: [] }]
      summary: Replace the instance two-factor policy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTwoFactorPolicy' } } } }
      responses:
        '200': { description: Updated two-factor policy., content: { application/json: { schema: { $ref: '#/components/schemas/AdminTwoFactorPolicy' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/security/2fa-exemptions/{user}:
    put:
      operationId: adminSetTwoFactorExemption
      security: [{ cookieAuth: [] }]
      summary: Grant or replace a user's two-factor exemption
      parameters: [{ $ref: '#/components/parameters/AdminUserID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTwoFactorExemption' } } } }
      responses:
        '204': { description: Exemption stored. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: adminDeleteTwoFactorExemption
      security: [{ cookieAuth: [] }]
      summary: Remove a user's two-factor exemption
      parameters: [{ $ref: '#/components/parameters/AdminUserID' }]
      responses:
        '204': { description: Exemption removed or already absent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/audit:
    get:
      operationId: adminListAudit
      security: [{ cookieAuth: [] }]
      summary: List instance administration audit entries
      parameters: [{ $ref: '#/components/parameters/AdminLimit' }]
      responses:
        '200': { description: Instance audit entries., content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuditResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/admin/organizations/{org}/github-star-repo-limit:
    get:
      operationId: adminGetGitHubStarRepoLimit
      security: [{ cookieAuth: [] }]
      summary: How many GitHub repositories an organization may track
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      responses:
        '200': { description: The effective limit., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarRepoLimit' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: adminSetGitHubStarRepoLimit
      security: [{ cookieAuth: [] }]
      summary: Set an organization's own limit on tracked GitHub repositories
      description: A number is the cap, 0 allows none, and null means unlimited. Lowering a limit below the current count deletes nothing; existing repositories keep syncing and only new ones are refused. Audited as github_stars.limit_changed.
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubStarRepoLimitInput' }
      responses:
        '200': { description: The effective limit after the change., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarRepoLimit' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: adminResetGitHubStarRepoLimit
      security: [{ cookieAuth: [] }]
      summary: Remove an organization's own limit so the instance default applies
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      responses:
        '200': { description: The effective limit after the change., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarRepoLimit' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/repos:
    get:
      operationId: orgListGitHubStarsRepos
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      summary: List the organization's tracked GitHub repositories
      description: Any member of the organization may read. Secrets and tokens are never returned; webhook_url is the endpoint to configure on GitHub.
      responses:
        '200': { description: Tracked repositories., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsRepos' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: orgCreateGitHubStarsRepo
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgPathID' }]
      summary: Track a repository
      description: Checks the repository exists with one GitHub call (a GitHub outage or rate limit does not block the save). The response carries the webhook secret, shown exactly once. Owners and admins only. The organization may track a limited number of repositories (5 unless the instance or an instance admin sets another limit); beyond it the request is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubStarsRepoInput' }
      responses:
        '201': { description: Repository added., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsRepoSecret' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The repository is already tracked or the limit is reached., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/repos/{id}:
    patch:
      operationId: orgUpdateGitHubStarsRepo
      security: [{ cookieAuth: [] }]
      summary: Enable or disable a repository, change its time zone or public counter, or set or clear its token
      description: Owners and admins only.
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubStarsRepoPatch' }
      responses:
        '200': { description: Updated repository., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsRepo' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: orgDeleteGitHubStarsRepo
      security: [{ cookieAuth: [] }]
      summary: Disable a repository, or remove it with its data
      description: delete_data is required. false only disables the repository and keeps its history (200). true deletes the configuration and every event, snapshot, annotation and erasure record of the repository in one transaction (204).
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: delete_data, in: query, required: true, schema: { type: boolean } }
      responses:
        '200': { description: Repository disabled., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsRepo' } } } }
        '204': { description: Repository and its data removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/repos/{id}/rotate-secret:
    post:
      operationId: orgRotateGitHubStarsSecret
      security: [{ cookieAuth: [] }]
      summary: Replace the webhook secret
      description: The new secret is returned exactly once; update it on GitHub.
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: New secret., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsRepoSecret' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/repos/{id}/sync:
    post:
      operationId: orgSyncGitHubStarsRepo
      security: [{ cookieAuth: [] }]
      summary: Reconcile and backfill a repository now
      description: Starts the sync in the background. At most one runs per repository and manual syncs must be a minute apart; the outcome appears in last_reconcile_at and last_error.
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '202': { description: Sync started. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A sync is already running., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/repos/{id}/trending:
    get:
      operationId: orgGetGitHubStarsTrending
      security: [{ cookieAuth: [] }]
      summary: Trending watcher status, current episodes and recent history
      description: Whether the repository is on github.com/trending (all languages and its primary language, daily and weekly). Scraped on a best-effort basis every 10 minutes; a page that cannot be read never ends an episode and shows as status unreadable. Readable by any member of the organization; opt in with trending_enabled on the repository PATCH (owners and admins).
      parameters:
        - { $ref: '#/components/parameters/OrgPathID' }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Trending status., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubTrendingStatus' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/orgs/{org}/github-stars/repos/{id}/alerts:
    parameters:
      - { $ref: '#/components/parameters/OrgPathID' }
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: orgGetGitHubStarsAlerts
      security: [{ cookieAuth: [] }]
      summary: Star alert settings of a repository
      description: Which events are on (all off by default) and which of the organization's notification channels receive them. Any member may read.
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsAlertSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: orgSaveGitHubStarsAlerts
      security: [{ cookieAuth: [] }]
      summary: Replace the star alert settings of a repository
      description: Owners and admins only. Every channel id must belong to the organization.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsAlertSettingsInput' } } }
      responses:
        '200': { description: Saved settings., content: { application/json: { schema: { $ref: '#/components/schemas/GitHubStarsAlertSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
