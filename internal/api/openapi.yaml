      description: Requires segments:write or sites:write. The mutation is recorded in the organization audit log.
      responses:
        '204': { description: Segment deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/v1/sites/{site_id}/events:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: from
        in: query
        required: true
        schema: { type: string, format: date, example: '2026-10-01' }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date, example: '2026-10-08' }
      - name: name
        in: query
        schema: { type: string, maxLength: 2000, example: signup }
      - $ref: '#/components/parameters/Filters'
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    get:
      operationId: listEvents
      summary: Explore raw pageviews and custom events
      description: Requires stats:read. Results are newest first and limited to the site's raw-data retention window. Visitor identifiers, IP addresses, and user agents are never returned.
      responses:
        '200':
          description: A page of raw events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventExploreList' }
              example:
                data:
                  - { ts: '2026-10-08T12:30:00Z', kind: event, name: signup, page: /pricing, props: { plan: pro }, country: US, device: desktop, browser: Chrome, source: Google }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/v1/sites/{site_id}/properties:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: from
        in: query
        required: true
        schema: { type: string, format: date }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date }
      - name: event
        in: query
        schema: { type: string, maxLength: 2000 }
    get:
      operationId: listProperties
      summary: List property keys and event counts
      description: Requires stats:read. Returns at most 100 keys from raw events.
      responses:
        '200':
          description: Property keys ordered by event count
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/PropertyKeyCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/v1/sites/{site_id}/properties/{property_key}/values:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: property_key
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 2000 }
      - name: from
        in: query
        required: true
        schema: { type: string, format: date }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date }
      - name: event
        in: query
        schema: { type: string, maxLength: 2000 }
    get:
      operationId: listPropertyValues
      summary: List top property values and event counts
      description: Requires stats:read. Returns at most 100 values from raw events.
      responses:
        '200':
          description: Property values ordered by event count
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/PropertyValueCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/v1/sites/{site_id}/suggestions:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - name: dimension
        in: query
        required: true
        schema: { type: string, example: page }
      - name: q
        in: query
        schema: { type: string, maxLength: 2000 }
      - name: from
        in: query
        required: true
        schema: { type: string, format: date }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date }
    get:
      operationId: listSuggestions
      summary: Suggest filter values
      description: Requires stats:read. Prefix matches rank ahead of substring matches; the response is capped at 20 values.
      responses:
        '200':
          description: Matching values
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: '#/components/schemas/Suggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Check process health
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Check service readiness
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /metrics:
    get:
      operationId: metrics
      security: []
      summary: Get Prometheus metrics
      description: >-
        When PANEL_METRICS_TOKEN is set, requires Authorization: Bearer <token> and
        returns 401 for missing or invalid credentials. When the token is unset,
        only loopback clients (resolved through PANEL_TRUSTED_PROXIES) can access
        metrics; other clients receive 404. Health and readiness endpoints remain public.
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys for the caller's organization
      description: Requires keys:manage. Secret values and hashes are never returned.
      responses:
        '200':
          description: API keys in the caller's organization
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createApiKey
      summary: Create a narrower API key
      description: Requires keys:manage. Scopes, site access, and expiry cannot exceed the caller key; keys:manage itself cannot be delegated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created; the secret is returned only in this response.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Requires keys:manage. A key may revoke itself. IDs outside the caller's organization return 404.
      responses:
        '204':
          description: API key revoked
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: panel_session
  parameters:
    SiteID:
      name: site_id
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 42
    SitePathID:
      name: site_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    GoalPathID:
      name: goal_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FunnelPathID:
      name: funnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Period'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    StatsPeriod:
      name: period
      in: query
      required: true
      description: "custom requires both date_from and date_to."
      schema:
        type: string
        pattern: '^(day|today|yesterday|7d|30d|month|last_month|6mo|12mo|year|all|custom)$'
        example: 30d
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date, example: '2026-09-01' }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date, example: '2026-09-30' }
    Timezone:
      name: timezone
      in: query
      description: IANA time zone; defaults to the site's time zone.
      schema: { type: string, example: Asia/Kolkata }
    Metrics:
      name: metrics
      in: query
      description: Comma-separated metric names. Endpoint defaults apply when omitted.
      schema: { type: string, example: visitors,pageviews }
    Filters:
      name: filter
      in: query
      description: "Repeat up to ten times as dimension:operator:value1,value2."
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items: { type: string, example: 'country:is:US,CA' }
    Compare:
      name: compare
      in: query
      schema: { type: string, pattern: '^previous_period$', example: previous_period }
    Format:
      name: format
      in: query
      schema: { type: string, pattern: '^(json|csv)$', default: json, example: csv }
    StatsLimit:
      name: limit
      in: query
      description: "1-1000, or all for a CSV export capped at 100,000 rows."
      schema:
        type: string
        pattern: '^(all|[1-9][0-9]{0,2}|1000)$'
        example: '100'
    ExportLimit:
      name: limit
      in: query
      description: "Set to all with CSV to stream up to 100,000 rows."
      schema: { type: string, pattern: '^all$', example: all }
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        example: eyJ2IjoxLCJrIjpbNDJdfQ
  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        format: int64
    RateLimitReset:
      description: RFC 3339 time when the current window resets.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        format: int64
  responses:
    QueryResult:
      description: Query results
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryResponse'
        text/csv:
          example: |-
            page,visitors,pageviews
            /docs,42,77
          schema:
            type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HealthCheck:
      description: The check succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    ServiceUnavailable:
      description: The service is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    APIKey:
      type: object
      additionalProperties: false
      required: [id, name, scopes, site_ids, created_at, expires_at, last_used_at, revoked]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        site_ids:
          type: [array, 'null']
          items: { type: integer, format: int32 }
          description: Null grants every site in the organization; an empty array grants none.
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked: { type: boolean }
    APIKeyList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1 }
        scopes:
          type: array
          items: { type: string }
        site_ids:
          type: array
          items: { type: integer, format: int32 }
        expires_at: { type: string, format: date-time }
    CreatedAPIKey:
      type: object
      additionalProperties: false
      required: [id, key]
      properties:
        id: { type: integer, format: int64 }
        key:
          type: string
          description: The secret value. It is shown once and cannot be retrieved later.
    AnnotationInput:
      type: object
      additionalProperties: false
      required: [day, text]
      properties:
        day: { type: string, format: date }
        text: { type: string, minLength: 1, maxLength: 200 }
    AnnotationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        day: { type: string, format: date }
        text: { type: string, minLength: 1, maxLength: 200 }
    EventPayload:
      type: object
      required: [site, name]
      properties:
        site:
          type: string
          description: Public site identifier.
          example: my-site
        name:
          type: string
          description: Event name, such as pageview or a custom event name.
          example: pageview
        url:
          type: string
          format: uri
          description: Full page URL. Required by the event intake handler.
          example: https://www.example.com/pricing
        referrer:
          type: string
          example: https://search.example/
        screen_width:
          type: integer
          minimum: 0
          maximum: 32767
          example: 1440
        props:
          type: object
          additionalProperties:
            type: string
          maxProperties: 30
          example: { plan: pro }
        engagement_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          example: 12500
        scroll_pct:
          type: integer
          minimum: 0
          maximum: 100
          example: 75
        revenue:
          type: object
          required: [amount, currency]
          properties:
            amount:
              oneOf:
                - type: number
                - type: string
              example: '29.99'
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              example: USD
        traits:
          type: object
          description: Profile traits for an identify event on a profiles-enabled site.
          additionalProperties:
            type: string
          maxProperties: 20
          example: { plan: pro }
        profile_id:
          type: string
          description: External profile identifier for a profiles-enabled site.
          maxLength: 128
          example: customer-123
    Site:
      type: object
      additionalProperties: false
      required: [id, org_id, public_id, name, timezone, retention_days, allowed_hosts, exclude_ips, exclude_paths, profiles_enabled, heatmaps_enabled, respect_privacy_signals]
      properties:
        id: { type: integer, format: int32 }
        org_id: { type: integer, format: int64 }
        public_id: { type: string }
        name: { type: string }
        timezone: { type: string }
