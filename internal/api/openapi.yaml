        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A submitted field is locked by an environment variable. }
  /api/private/instance/replay-storage:
    get:
      operationId: getReplayStorage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Get instance replay storage settings
      responses:
        '200': { description: Resolved storage settings without the S3 secret, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayStorageSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateReplayStorage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      summary: Replace instance replay storage settings
      description: migrate records a background migration request; migration execution is asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayStorageInput' }
      responses:
        '200': { description: Resolved storage settings, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayStorageSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A submitted field is locked by an environment variable. }
  /api/public/v1/events:
    options:
      operationId: preflightEvent
      security: []
      summary: Negotiate cross-origin event submission
      description: Returns the CORS policy used by browser-based event senders.
      parameters:
        - name: Origin
          in: header
          required: false
          schema: { type: string, format: uri }
        - name: Access-Control-Request-Method
          in: header
          required: false
          schema: { type: string, enum: [POST] }
        - name: Access-Control-Request-Headers
          in: header
          required: false
          schema: { type: string, example: Content-Type }
      responses:
        '204':
          description: Cross-origin event submission is permitted.
          headers:
            Access-Control-Allow-Origin:
              description: Origins permitted to submit events.
              schema: { type: string, example: '*' }
            Access-Control-Allow-Methods:
              description: Methods accepted by the event endpoint.
              schema: { type: string, example: 'POST, OPTIONS' }
            Access-Control-Allow-Headers:
              description: Request headers accepted by the event endpoint.
              schema: { type: string, example: Content-Type }
    post:
      operationId: submitEvent
      security: []
      summary: Submit an analytics event
      description: |
        Public event intake; no API key is required. Requests are counted against
        per-site and per-visitor-address rate limits. Deployments may configure a
        different path with `SUPERMETRY_EVENT_PATH`.

        When calling this endpoint through a reverse proxy, forward the visitor's
        address with `X-Forwarded-For` only when that proxy is listed in
        `SUPERMETRY_TRUSTED_PROXIES`. Forward the visitor's `User-Agent` as well so
        device dimensions and bot filtering remain accurate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
          text/plain:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '202':
          description: The event was accepted for processing.
        '400':
          description: The payload, site, page URL, or client address is invalid.
        '429':
          description: The site or visitor-address rate limit was exceeded.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '503':
          description: Event intake is unavailable or its bounded queue is full.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |-
            curl --request POST https://analytics.supermetry.com/api/public/v1/events \
              --header 'Content-Type: application/json' \
              --header 'User-Agent: Mozilla/5.0' \
              --header 'X-Forwarded-For: 203.0.113.10' \
              --data '{"site":"my-site","name":"pageview","url":"https://www.supermetry.com/pricing"}'
        - lang: JavaScript
          label: fetch
          source: |-
            await fetch('https://analytics.supermetry.com/api/public/v1/events', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'User-Agent': visitorUserAgent,
                // Only send this through a proxy listed in SUPERMETRY_TRUSTED_PROXIES.
                'X-Forwarded-For': visitorAddress,
              },
              body: JSON.stringify({
                site: 'my-site',
                name: 'pageview',
                url: 'https://www.supermetry.com/pricing',
              }),
            });
  /api/public/v1/mcp:
    post:
      operationId: mcp
      summary: Call the Model Context Protocol endpoint
      description: >-
        JSON-only Streamable HTTP MCP endpoint. The API key must grant
        stats:read; individual tools may require profiles:read, replay:read,
        or data:export. Invalid credentials, insufficient scopes, and other
        protocol-level failures are returned with HTTP 200 in the JSON-RPC
        response envelope. Invalid origin or protocol headers, rate limits,
        and service availability use RFC 9457 problem details. JSON-RPC
        notifications and response-only messages are acknowledged with 202.
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema:
            type: string
            enum: ['2025-06-18', '2025-03-26']
        - name: Origin
          in: header
          required: false
          description: When present, the origin host must match the request host.
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPMessage'
      responses:
        '200':
          description: JSON-RPC result or protocol-level error.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPResponse'
        '202':
          description: A notification or response-only message was accepted without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The request Origin does not match the request host.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/heatmaps/query:
    post:
      operationId: heatmapQuery
      summary: Query an aggregated click heatmap and scroll map
      requestBody:
        required: true
        content:
          application/json:
            schema:
