      type: object
      additionalProperties: false
      required: [overall, breakdown, timeseries]
      properties:
        overall:
          $ref: '#/components/schemas/VitalsMetrics'
        breakdown:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VitalsBreakdown'
        timeseries:
          type: array
          description: Daily site-timezone buckets from raw events within the site's retention window. Days without valid samples are included with zero sample counts and omitted percentiles.
          maxItems: 366
          items:
            $ref: '#/components/schemas/VitalsTrendPoint'
    FunnelStep:
      type: object
      additionalProperties: false
      required: [type, match, value]
      properties:
        type:
          type: string
          enum: [page, event]
          x-enum-varnames: [Page, Event]
        match:
          type: string
          enum: [exact, prefix, wildcard]
          description: >-
            Anchored value matching. Exact and prefix treat every character literally.
            Wildcard treats only `*` as matching any characters; `%` and `_` remain literal.
            The wildcard grammar has no escape for matching a literal `*`.
        value:
          type: string
        prop_key:
          type: string
          description: >-
            Custom-event property key that must match for this step.
        prop_value:
          type: string
          description: Exact custom-event property value required by prop_key.
    FunnelRequest:
      type: object
      additionalProperties: false
      required: [site_id, date_range, steps]
      properties:
        site_id:
          type: integer
          format: int32
          minimum: 1
        date_range:
          $ref: '#/components/schemas/DateRange'
        count_by:
          type: string
          enum: [sessions, visitors]
          x-enum-varnames: [FunnelCountBySessions, FunnelCountByVisitors]
          default: sessions
          description: Count completed steps by sessions (the default) or visitors. Profile-linked visitors can complete steps across sessions inside a non-session window. Anonymous visitors use the daily salted visitor ID and therefore link only within one site-local day.
        window:
          type: string
          enum: [session, 1h, 24h, 7d]
          x-enum-varnames: [FunnelWindowSession, FunnelWindow1h, FunnelWindow24h, FunnelWindow7d]
          default: session
          description: Maximum elapsed time from step 1 through each later ordered step. session keeps every step in one session and is the default. Closed rows compacted before event timestamps were stored use their stable session ordering when raw data is no longer available for reconstruction.
        steps:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FunnelStep'
    FunnelStepResult:
      type: object
      additionalProperties: false
      required: [step, count, visitors, conversion]
      properties:
        step:
          type: integer
          minimum: 1
        count:
          type: integer
          format: int64
          description: Number of sessions or visitors, as selected by count_by, that completed this ordered step.
        visitors:
          type: integer
          format: int64
          deprecated: true
          description: Deprecated alias of count; always identical.
        conversion:
          type: number
          format: double
    FunnelResponse:
      type: object
      additionalProperties: false
      required: [count_by, steps]
      properties:
        count_by:
          type: string
          enum: [sessions, visitors]
          x-enum-varnames: [FunnelResponseCountBySessions, FunnelResponseCountByVisitors]
          description: Entity counted in every step count.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepResult'
