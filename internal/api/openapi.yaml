      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareSectionRequest' } } }
      responses:
        '200': { description: Server-scoped section data, content: { application/json: { schema: { $ref: '#/components/schemas/QueryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replays:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listReplays
      security: [{ cookieAuth: [] }]
      summary: List session replays
      description: Requires replay.read. Profile identifiers are null unless profiles.read is also granted.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive entry path, exit path, country, browser, trigger, or event-name search. }
        - { name: min_duration, in: query, schema: { type: integer, format: int64, minimum: 0, maximum: 31536000 }, description: Inclusive minimum replay duration in seconds. }
        - { name: max_duration, in: query, schema: { type: integer, format: int64, minimum: 0, maximum: 31536000 }, description: Inclusive maximum replay duration in seconds. }
        - { name: has_events, in: query, schema: { type: boolean }, description: Restrict to sessions with or without custom events. }
        - { name: saved, in: query, schema: { type: boolean }, description: Restrict to replays saved or not saved by the current user. }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Replay page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/private/sites/{site_id}/replays/{session_id}/saved:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: session_id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
    put:
      operationId: saveReplay
      security: [{ cookieAuth: [] }]
      summary: Save a replay for the current user
      description: Requires replay.read. Repeated requests are idempotent; only state changes write audit entries.
      responses:
        '204': { description: Replay saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: unsaveReplay
      security: [{ cookieAuth: [] }]
      summary: Remove the current user's saved replay marker
      description: Requires replay.read. Repeated requests are idempotent; only state changes write audit entries.
      responses:
        '204': { description: Saved marker removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/private/sites/{site_id}/replays/{session_id}/data:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - { name: session_id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
    get:
      operationId: getReplayData
      security: [{ cookieAuth: [] }]
      summary: Download replay events
      description: Requires replay.read for the requested site. Recording access never enables collection or changes instance privacy settings.
      responses:
        '200':
          description: A gzip-compressed NDJSON event stream
