  /api/public/v1/journeys/query:
    post:
      operationId: journeyQuery
      summary: Run a page journey query
      description: >-
        Counts distinct daily visitors across page flows in site-local sessions (consecutive repeats of a page collapse).
        Reads closed days and recent raw events, so ranges are limited to 366 days but not to the raw retention window.
        Answers 403 in anonymous tracking mode, where visitors cannot be linked across days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
      responses:
        '200':
          description: Sankey-ready journey nodes and links
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/retention/query:
    post:
      operationId: retentionQuery
      summary: Run a retention query
      description: >-
        Requires stats:read; identity=profile additionally requires profiles:read.
        Visitor identity is linkable only within one local day. Offset n counts
        daily identities with at least n+1 sessions on that local day; week and
