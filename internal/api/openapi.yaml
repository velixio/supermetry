openapi: 3.1.0
info:
  title: Panel Analytics API
  version: 1.0.0
  description: The versioned API for querying Panel analytics and operational health.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/public/v1/query:
    post:
      operationId: query
      summary: Run an analytics query
      description: "Set Accept: text/csv or format=csv for CSV. With CSV, limit=all streams cursor pages up to 100,000 rows."
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/ExportLimit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/stats/summary:
    get:
      operationId: statsSummary
      summary: Get summary metrics
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/stats/timeseries:
    get:
      operationId: statsTimeseries
      summary: Get a metrics time series
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
        - name: interval
          in: query
          schema:
            type: string
            pattern: '^(hour|day|week|month)$'
            default: day
            example: day
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/stats/breakdown:
    get:
      operationId: statsBreakdown
      summary: Get a dimension breakdown
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Metrics'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Format'
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            example: page
        - $ref: '#/components/parameters/StatsLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/public/v1/funnels/query:
    post:
      operationId: funnelQuery
      summary: Run a funnel query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelRequest'
      responses:
        '200':
          description: Funnel results
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/journeys/query:
    post:
      operationId: journeyQuery
      summary: Run a page journey query
      description: The date range must fit within the site's raw-event retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
      responses:
        '200':
          description: Sankey-ready journey nodes and links
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/retention/query:
    post:
      operationId: retentionQuery
      summary: Run a retention query
      description: >-
        Visitor identity is linkable only within one local day. Offset n counts
        daily identities with at least n+1 sessions on that local day; week and
        month intervals group daily cohorts and do not link people across days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionRequest'
      responses:
        '200':
          description: Within-day session-return cohorts
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/realtime:
    get:
      operationId: realtime
      summary: Get active visitors, pages, and sources from the last 30 minutes
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Realtime analytics
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/sites:
    get:
      operationId: listSites
      summary: List accessible sites
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sites page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createSite
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/v1/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: getSite
      summary: Get a site
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSite
      summary: Update a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSite
      summary: Delete a site
      responses:
        '204':
          description: Site deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/goals:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listGoals
      summary: List goals
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createGoal
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/goals/{goal_id}:
    parameters:
      - $ref: '#/components/parameters/GoalPathID'
    patch:
      operationId: updateGoal
      summary: Update a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '200':
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      responses:
        '204':
          description: Goal deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/funnels:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listFunnels
      summary: List saved funnels
      responses:
        '200':
          description: Funnels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedFunnel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createFunnel
      summary: Create a saved funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFunnelInput'
      responses:
        '201':
          description: Funnel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/funnels/{funnel_id}:
    parameters:
      - $ref: '#/components/parameters/FunnelPathID'
    patch:
      operationId: updateFunnel
      summary: Update a saved funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFunnelInput'
      responses:
        '200':
          description: Updated funnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFunnel
      summary: Delete a saved funnel
      responses:
        '204':
          description: Funnel deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/v1/sites/{site_id}/segments:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: listSegments
      summary: List saved segments
      description: Requires the stats:read API-key scope for the requested site.
      responses:
        '200':
          description: Saved segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Segment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Check process health
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Check service readiness
      responses:
        '200':
          $ref: '#/components/responses/HealthCheck'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /metrics:
    get:
      operationId: metrics
      security: []
      summary: Get Prometheus metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SiteID:
      name: site_id
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 42
    SitePathID:
      name: site_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    GoalPathID:
      name: goal_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FunnelPathID:
      name: funnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Period'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    StatsPeriod:
      name: period
      in: query
      required: true
      description: "custom requires both date_from and date_to."
      schema:
        type: string
        pattern: '^(day|today|yesterday|7d|30d|month|last_month|6mo|12mo|year|all|custom)$'
        example: 30d
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date, example: '2026-09-01' }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date, example: '2026-09-30' }
    Timezone:
      name: timezone
      in: query
      description: IANA time zone; defaults to the site's time zone.
      schema: { type: string, example: Asia/Kolkata }
    Metrics:
      name: metrics
      in: query
      description: Comma-separated metric names. Endpoint defaults apply when omitted.
      schema: { type: string, example: visitors,pageviews }
    Filters:
      name: filter
      in: query
      description: "Repeat up to ten times as dimension:operator:value1,value2."
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items: { type: string, example: 'country:is:US,CA' }
    Compare:
      name: compare
      in: query
      schema: { type: string, pattern: '^previous_period$', example: previous_period }
    Format:
      name: format
      in: query
      schema: { type: string, pattern: '^(json|csv)$', default: json, example: csv }
    StatsLimit:
      name: limit
      in: query
      description: "1-1000, or all for a CSV export capped at 100,000 rows."
      schema:
        type: string
        pattern: '^(all|[1-9][0-9]{0,2}|1000)$'
        example: '100'
    ExportLimit:
      name: limit
      in: query
      description: "Set to all with CSV to stream up to 100,000 rows."
      schema: { type: string, pattern: '^all$', example: all }
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        example: eyJ2IjoxLCJrIjpbNDJdfQ
  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        format: int64
    RateLimitReset:
      description: RFC 3339 time when the current window resets.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        format: int64
  responses:
    QueryResult:
      description: Query results
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryResponse'
        text/csv:
          example: |-
            page,visitors,pageviews
            /docs,42,77
          schema:
            type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HealthCheck:
      description: The check succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    ServiceUnavailable:
      description: The service is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Site:
      type: object
      additionalProperties: false
      required: [id, org_id, public_id, name, timezone, retention_days, allowed_hosts]
      properties:
        id: { type: integer, format: int32 }
        org_id: { type: integer, format: int64 }
        public_id: { type: string }
        name: { type: string }
        timezone: { type: string }
        retention_days: { type: integer }
        allowed_hosts:
          type: array
          items: { type: string }
    SiteList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        next_cursor:
          type: [string, 'null']
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, hosts, timezone, retention_days]
      properties:
        name: { type: string }
        hosts:
          type: array
          minItems: 1
          items: { type: string }
        timezone: { type: string }
        retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
    UpdateSiteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        hosts:
          type: array
          minItems: 1
          items: { type: string }
        timezone: { type: string }
        retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
    GoalInput:
      type: object
      additionalProperties: false
      required: [kind, match, value, name]
      properties:
        kind:
          type: string
          enum: [page, event]
          x-enum-varnames: [GoalInputPage, GoalInputEvent]
