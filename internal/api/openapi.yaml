      required: [id, org_id, public_id, slug, name, domain, timezone, organization, role, created_at, visitors, previous_visitors, change_percent, sparkline, live_visitors, last_event_at, install_status, tracking_snippet]
      properties:
        id: { type: integer, format: int32 }
        org_id: { type: integer, format: int64 }
        public_id: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', minLength: 1, maxLength: 63, description: Readable per-organization URL segment; public_id resolves too. }
        name: { type: string }
        domain: { type: string }
        timezone: { type: string }
        icon_url: { type: string }
        organization:
          type: object
          additionalProperties: false
          required: [id, name, slug]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            slug: { type: string }
        role:
          type: string
          description: Membership role for the site's organization (owner, admin, editor, or viewer).
        created_at: { type: string, format: date-time }
        visitors: { type: integer, format: int64 }
        previous_visitors: { type: integer, format: int64 }
        change_percent: { type: [number, 'null'], format: double }
        sparkline:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [start, visitors]
            properties:
              start: { type: string, format: date-time }
              visitors: { type: integer, format: int64 }
        live_visitors: { type: integer }
        last_event_at: { type: [string, 'null'], format: date-time }
        install_status:
          type: string
          description: Tracking state (waiting, receiving, or quiet).
        tracking_snippet: { type: string }
    ShareExpiryDays:
