      properties:
        user:
          type: object
          required: [id, email, name, totp_enabled, created_at, instance_admin, two_factor_setup_required]
          properties:
            id: { type: integer, format: int64 }
            email: { type: string, format: email }
            name: { type: string }
            totp_enabled: { type: boolean }
            created_at: { type: string, format: date-time }
            last_login_at: { type: string, format: date-time }
            instance_admin: { type: boolean }
            two_factor_setup_required: { type: boolean }
            two_factor_grace_until: { type: string, format: date-time }
        preferences: { $ref: '#/components/schemas/UserPreferences' }
        memberships:
          type: array
          items:
            type: object
            required: [org, role, site_ids, capabilities, billing_admin, effective_capabilities, sites]
            properties:
              org:
                type: object
                required: [id, name, slug]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
                  slug: { type: string }
              role: { type: string, enum: [owner, admin, editor, viewer] }
              site_ids:
                type: [array, 'null']
                items: { type: integer, format: int32 }
              capabilities:
                type: array
                items: { type: string }
              billing_admin: { type: boolean }
              effective_capabilities:
                type: array
                items: { type: string }
              sites:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
        demo_prompt_dismissed: { type: boolean }
        version:
          type: string
          description: Build version reported by the running binary; development builds report dev.
        impersonated_by_email:
          type: [string, 'null']
