      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Cohort' } }
    CohortEvaluateRequest:
      type: object
      additionalProperties: false
      description: Provide exactly one of cohort_id and definition.
      properties:
        cohort_id: { type: integer, format: int64, minimum: 1 }
        definition: { $ref: '#/components/schemas/CohortDefinition' }
        sample_limit: { type: integer, minimum: 0, maximum: 50, default: 0 }
    CohortMember:
      type: object
      required: [id, external_id, first_seen_at, last_seen_at, sessions, events]
      properties:
        id: { type: integer, format: int64 }
        external_id: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        sessions: { type: integer, format: int64, description: Sessions inside the window. }
        events: { type: integer, format: int64, description: Pageviews and custom events inside the window. }
    CohortEvaluation:
      type: object
