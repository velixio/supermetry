name: CI

# Manual runs only until the push and pull-request triggers below are enabled.
on:
  workflow_dispatch:
  # push:
  # pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: supermetry
          POSTGRES_PASSWORD: supermetry
          POSTGRES_DB: supermetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supermetry -d supermetry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPERMETRY_TEST_DSN: postgres://supermetry:supermetry@127.0.0.1:5432/supermetry?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Generate deterministic test fixtures
        run: make fixtures

      - name: Test Go packages with race detector
        run: go test -race -p 2 -timeout 40m -skip TestBackupRestoreIntegration ./...

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Test tracker size budgets
        run: go test -count=1 ./internal/tracker -run 'TestMinified(Tracker|FullTracker)GzipSize$'

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: bun run typecheck

      - name: Test web
        working-directory: web
        run: bun run test --run

      - name: Build web
        working-directory: web
        run: bun run build
